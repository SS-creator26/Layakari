<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Layakari · Kathak and tabla compositions, academies and practice</title>
<meta name="description" content="A home for Kathak and tabla artists. Composers publish and license their work, gurus run their academies, and students practise every piece with full notation and a live theka.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Layakari">
<meta property="og:title" content="Layakari · Every composition finds its sam">
<meta property="og:description" content="Publish, license, teach and practise Kathak and tabla compositions, with notation and a live theka.">
<meta property="og:url" content="https://layakari.ca">
<meta name="theme-color" content="#2A1B33">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232A1B33'/%3E%3Ccircle cx='16' cy='17' r='9' fill='none' stroke='%23E8A33D' stroke-width='2.4'/%3E%3Ccircle cx='16' cy='8' r='3' fill='%23E8A33D'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Mukta:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: web app shell, left sidebar nav + scrolling main column; sidebar becomes a bottom tab bar on phones. Modal for detail and forms. */
:root{
  --bg:#F4F0F6; --surface:#FFFFFF; --surface2:#EEE7F1; --ink:#22182A; --muted:#6B5E74; --line:#E0D7E5;
  --gold:#A4580F; --gold-ink:#FFFFFF; --gold-soft:#F6E7D6; --teal:#1E7A6E; --teal-soft:#DDF0EC; --danger:#B23A4E;
  --hero1:#2A1B33; --hero2:#5A2E4E; --on-hero:#F6EFF8; --on-hero-mut:#CDBBD6; --beat:#E8A33D; --beat-ink:#241405;
  --display:"Rozha One", Georgia, serif; --body:"Mukta", system-ui, -apple-system, "Segoe UI", sans-serif; --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --shadow:0 18px 50px -20px rgba(40,15,50,.35);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#151019;--surface:#1E1725;--surface2:#2A2033;--ink:#F1E9F5;--muted:#A99BB3;--line:#33293D;--gold:#E8A33D;--gold-ink:#241405;--gold-soft:#3A2A1A;--teal:#57C9B9;--teal-soft:#1B3330;--danger:#F07A8D;--shadow:0 18px 50px -20px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151019;--surface:#1E1725;--surface2:#2A2033;--ink:#F1E9F5;--muted:#A99BB3;--line:#33293D;--gold:#E8A33D;--gold-ink:#241405;--gold-soft:#3A2A1A;--teal:#57C9B9;--teal-soft:#1B3330;--danger:#F07A8D;--shadow:0 18px 50px -20px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:4px;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface)}
.brand{font:400 26px var(--display);padding:0 10px 16px;display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px;color:var(--gold)}
.nav{display:flex;align-items:center;gap:10px;background:none;border:0;padding:9px 10px;border-radius:10px;text-align:left;font-weight:500;color:var(--muted)}
.nav svg{width:20px;height:20px;flex:none}
.nav:hover{background:var(--surface2);color:var(--ink)}
.nav[aria-current="page"]{background:var(--gold-soft);color:var(--gold)}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--line)}
.me img{width:32px;height:32px;border-radius:50%}
.me b{display:block;font-size:13.5px;line-height:1.2}
.me span{font-size:12px;color:var(--muted)}
main{min-width:0;padding-inline:clamp(16px,4vw,48px);padding-block:28px 140px}
.wrap{max-width:1080px;margin:0 auto}
.app.gated{grid-template-columns:minmax(0,1fr)}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);z-index:20}
  .brand,.me{display:none}
  .nav{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;flex:1;align-items:center}
  main{padding-block:20px 170px}
}
h1{font:400 clamp(30px,4.2vw,42px)/1.08 var(--display);margin:0 0 6px;text-wrap:balance}
h2{font:400 24px/1.15 var(--display);margin:0;text-wrap:balance}
h3{font-size:16px;margin:0;font-weight:600}
.lede{color:var(--muted);margin:0;max-width:62ch}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:0 0 8px}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:34px 0 14px;flex-wrap:wrap}
.sec span{color:var(--muted);font-size:13px}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;background:var(--gold);color:var(--gold-ink);white-space:nowrap}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--surface2)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-top:18px;max-width:560px}
.search input{flex:1;border:0;background:none;outline:none;min-width:0}
.search svg{width:16px;height:16px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}
.card{background:none;border:0;padding:0;text-align:left;min-width:0}
.cover{width:100%;aspect-ratio:1;max-width:100%;border-radius:14px;display:block}
.card b{display:block;margin-top:8px;font-size:14.5px;line-height:1.25}
.card span{font-size:12.5px;color:var(--muted);display:block}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .cover{width:52px;flex:none;border-radius:10px}
.li .meta{flex:1;min-width:0}
.li .meta b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .meta span{font-size:12.5px;color:var(--muted)}
.li button.meta{background:none;border:0;padding:0;text-align:left}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.gold{border-color:var(--gold);color:var(--gold)}
.pill.teal{border-color:var(--teal);color:var(--teal)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:400 15px var(--display);color:#fff;flex:none}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.acad{display:flex;flex-direction:column;gap:8px}
.acad .top{display:flex;gap:12px;align-items:center}
.acad p{margin:0;font-size:13.5px;color:var(--muted)}
.hero{border-radius:20px;padding:22px;background:radial-gradient(120% 120% at 100% 0%,var(--hero2) 0%,var(--hero1) 60%);color:var(--on-hero)}
.hero .k{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--beat)}
.hero b.big{display:block;font:400 40px/1.1 var(--display);margin:4px 0}
.hero p{margin:0;color:var(--on-hero-mut);font-size:13.5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile span{display:block;font-size:12.5px;color:var(--muted)}
.tile b{font-family:var(--mono);font-weight:500;font-size:18px;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
th{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:500}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13px;white-space:nowrap}
.empty{border:1px dashed var(--line);border-radius:16px;padding:26px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty b{color:var(--ink);font-size:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-weight:600;font-size:13.5px}
.tab[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft);color:var(--gold)}
.tab small{font-family:var(--mono);font-weight:400;color:var(--muted);margin-left:4px}
.sw{width:42px;height:24px;border-radius:999px;border:0;background:var(--surface2);position:relative;flex:none;box-shadow:inset 0 0 0 1px var(--line)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--teal)}
.sw[aria-checked="true"]::after{transform:translateX(18px);background:#fff}
.sw[disabled]{opacity:.4;cursor:not-allowed}
select.inline{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 8px;font-size:13px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(15,8,20,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(5vh,16px) 16px;overflow-y:auto;z-index:40}
.dlg{width:min(720px,100%);background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:22px;position:relative}
.dlg.narrow{width:min(520px,100%)}
.x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:0;background:var(--surface2);display:grid;place-items:center}
.x svg{width:16px;height:16px}
.det{display:grid;grid-template-columns:180px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:600px){.det{grid-template-columns:minmax(0,1fr)}.det .cover{max-width:180px}}
.meta-line{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.taal{margin-top:18px;background:var(--hero1);color:var(--on-hero);border-radius:16px;padding:14px}
.taal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px}
.taal-head span{font-family:var(--mono);font-size:11px;color:var(--on-hero-mut)}
.beats{display:grid;gap:5px}
.m{position:relative;background:rgba(255,255,255,.07);border-radius:8px;padding:15px 2px 6px;text-align:center;font-size:12px;line-height:1.1;min-width:0;overflow:hidden}
.m small{position:absolute;top:2px;left:0;right:0;font-family:var(--mono);font-size:9.5px;color:var(--on-hero-mut)}
.m.vs small{color:var(--beat)}
.m.sam{box-shadow:inset 0 0 0 1px var(--beat)}
.m.on{background:var(--beat);color:var(--beat-ink)}
.m.on small{color:var(--beat-ink)}
.ctrl{display:flex;align-items:center;gap:14px;margin-top:12px}
.bigplay{width:46px;height:46px;border-radius:50%;border:0;background:var(--beat);color:var(--beat-ink);display:grid;place-items:center;flex:none}
.bigplay svg{width:22px;height:22px}
.ctrl label{flex:1;font-size:12px;color:var(--on-hero-mut);display:flex;flex-direction:column}
.ctrl input{accent-color:var(--beat);width:100%}
.bols{margin-top:12px;font-family:var(--mono);font-size:12.5px;line-height:1.7;background:rgba(0,0,0,.25);border-radius:12px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.lock{color:var(--on-hero-mut);font-family:var(--body);font-size:12.5px;margin-top:6px}
.lic{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}
.lic-opt{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:2px}
.lic-opt b{font-size:14px}
.lic-opt span{font-size:12px;color:var(--muted)}
.lic-opt em{font-style:normal;font-family:var(--mono);font-size:14px;margin-top:6px}
.lic-opt.owned{border-color:var(--teal);background:var(--teal-soft)}
.lic-opt.owned em{color:var(--teal)}
.access{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--teal);font-weight:600;margin-top:12px}
.access svg{width:16px;height:16px;flex:none}
/* forms */
form .f{display:flex;flex-direction:column;gap:4px;margin-top:12px;font-size:13px;color:var(--muted);font-weight:500}
form .f input,form .f select,form .f textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;color:var(--ink);font-size:14.5px;font-weight:400}
form .f textarea{min-height:96px;font-family:var(--mono);font-size:13px}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0 12px}
.roles{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.roles label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13.5px;color:var(--ink);cursor:pointer}
.roles input{accent-color:var(--gold)}
.form-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.gate{min-height:80vh;display:grid;place-items:center;padding:16px}
.gate .dlg{box-shadow:var(--shadow)}
[hidden]{display:none!important}
.app.gated main{padding:0}
.app.gated .gate{min-height:100vh}
/* landing */
.land{position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-rows:auto 1fr;grid-template-areas:"copy auth" "feats auth";min-height:100vh;isolation:isolate}
.land::before{content:"";position:absolute;top:0;left:0;right:0;bottom:-160px;z-index:-1;background:radial-gradient(60% 55% at 85% 35%,rgba(232,163,61,.10) 0%,transparent 60%),radial-gradient(70% 70% at 55% 0%,var(--hero2) 0%,transparent 70%),radial-gradient(60% 60% at 0% 90%,#3E2443 0%,transparent 70%),var(--hero1);-webkit-mask-image:linear-gradient(to bottom,#000 0,#000 calc(100% - 170px),transparent 100%);mask-image:linear-gradient(to bottom,#000 0,#000 calc(100% - 170px),transparent 100%)}
.land-copy{grid-area:copy;color:var(--on-hero);padding:clamp(28px,5vw,64px) clamp(20px,5vw,64px) 0;display:flex;flex-direction:column;gap:18px}
.land-brand{display:flex;align-items:center;gap:10px;font:400 26px var(--display);color:var(--on-hero)}
.land-brand svg{width:28px;height:28px;color:var(--beat)}
.land-copy .k{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--beat);margin:clamp(12px,4vh,40px) 0 0}
.land-copy h1{font:400 clamp(36px,5.2vw,64px)/1.02 var(--display);margin:0;max-width:15ch;color:var(--on-hero)}
.land-copy h1 em{font-style:normal;color:var(--beat)}
.land-copy .lede{color:var(--on-hero-mut);font-size:clamp(15px,1.3vw,17px);max-width:46ch;margin:0}
.land-row{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.land-ring{width:clamp(120px,14vw,170px);flex:none}
.land-ring circle.d{fill:rgba(246,239,248,.16);animation:matra 8s steps(1) infinite}
.land-ring circle.vib{fill:none;stroke:rgba(246,239,248,.45);stroke-width:1.2}
.land-ring circle.sam{fill:var(--beat)}
@keyframes matra{0%{fill:var(--beat)}6.25%,100%{fill:rgba(246,239,248,.16)}}
.land-ring circle.sam{animation-name:sammatra}
@keyframes sammatra{0%{fill:#fff}6.25%,100%{fill:var(--beat)}}
.land-ring text{font:400 15px var(--display);fill:var(--on-hero)}
.land-ring .bol{font:500 7.5px var(--mono);fill:var(--on-hero-mut);letter-spacing:.08em}
.land-legend{font-family:var(--mono);font-size:11.5px;color:var(--on-hero-mut);line-height:1.7}
.land-legend b{color:var(--on-hero);font-weight:500}
.land-feats{grid-area:feats;list-style:none;margin:0;padding:clamp(24px,4vh,40px) clamp(20px,5vw,64px) clamp(28px,5vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:14px;align-content:end}
.land-feats li{border:1px solid rgba(246,239,248,.14);background:rgba(255,255,255,.04);border-radius:16px;padding:14px 16px;color:var(--on-hero-mut);font-size:13.5px;line-height:1.45}
.land-feats b{display:block;color:var(--on-hero);font:400 18px var(--display);margin-bottom:4px}
.land-feats span.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;color:var(--beat);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.land-auth{grid-area:auth;display:grid;place-items:center;padding:clamp(20px,4vw,56px)}
.land-auth .dlg{box-shadow:var(--shadow);width:min(440px,100%)}
.land-auth .fine{font-size:12px;color:var(--muted);margin:14px 0 0;text-align:center}
@media (max-width:900px){
  .land{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;grid-template-areas:"copy" "auth" "feats"}
  .land-copy{padding-bottom:20px}
  .land-copy .k{margin-top:4px}
  .land-auth{padding:20px 16px;margin-top:-1px}
  .land-feats{padding-top:20px}
}
@media (prefers-reduced-motion: reduce){.land-ring circle.d{animation:none}}
.land{min-height:calc(100vh - 64px)}
.land-auth .reassure{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin:12px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--muted)}
.land-auth .reassure li::before{content:"✓ ";color:var(--teal);font-weight:700}
.more{padding:clamp(40px,7vw,88px) clamp(16px,5vw,64px);max-width:1180px;margin:0 auto}
.more + .more{padding-top:0}
.more h2.sh{font:400 clamp(28px,3.4vw,40px)/1.1 var(--display);margin:0 0 8px;text-wrap:balance}
.more .sl{color:var(--muted);margin:0 0 26px;max-width:60ch}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:16px;counter-reset:st;margin:0;padding:0;list-style:none}
.steps li{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;counter-increment:st}
.steps li::before{content:counter(st);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--gold-soft);color:var(--gold);font:400 18px var(--display);margin-bottom:12px}
.steps b{display:block;font-size:16px;margin-bottom:4px}
.steps span{color:var(--muted);font-size:14px}
.demo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:clamp(20px,4vw,48px);align-items:center}
@media (max-width:820px){.demo{grid-template-columns:minmax(0,1fr)}}
.demo-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.demo-top{display:flex;gap:14px;align-items:center}
.demo-top .cover{width:72px;flex:none;border-radius:12px}
.demo-top h3{font:400 22px/1.15 var(--display);margin:2px 0 0}
.demo-card .taal{margin-top:16px}
.demo-card .bols{margin-top:10px}

/* Layakari notation reader.
   Reads bol notation in the style explained on DigiTabla.com's notation guide:
   - each word is one matra; bars and dandas (| । ॥) mark vibhags and don't change the timing
   - bols inside a word share the matra equally: "dhadha" is two bols, "tirakita" is four,
     and a hyphen inside a word just joins bols: "Dha-ge" is the same as "Dhage"
   - a dash (– — ऽ, or a hyphen that isn't between two letters) is a gap that takes one slot, like a bol
   - text in brackets, like "(×3)", is a note and is skipped
   - a comma splits the matra into halves: "dha,dheradhera"; a trailing comma ends the matra halfway
   - Roman (with or without diacritics) and Devanagari both work

 [124,"Jhananana","झननन","Ringing / sound-imitative phrase"],
 [125,"Tharree / Tharee","थर्री","Parmelu-style syllable"],
 [126,"Thorang","थोरंग","Nature-inspired bol"],
 [127,"Tak Thunga","तक थुंगा","Composite phrase"],
 [128,"Tava Thunga","तब थुंगा","Composite phrase"],
 [129,"Takita Thunga","तकित थुंगा","Composite phrase"],
 [130,"Takadum Thei","तकदुम थेई","Composite phrase"],
 [131,"Tatkar","तत्कार","Footwork vocabulary / technique"],
 [132,"Natwari","नटवरी","Dance-bol style"],
 [133,"Toda","तोड़ा","Composition form"],
 [134,"Tukda","टुकड़ा","Composition form"],
 [135,"Paran","परन","Composition form"],
 [136,"Parmelu","परमेलु","Composition form"],
 [137,"Tihai","तिहाई","Rhythmic structure repeated three times"],
 [138,"Aamad","आमद","Kathak presentation/composition form"],

const TERMS=new Set([131,132,133,134,135,136,137,138,139]);
/* rows that are another spelling of an earlier row, as their notes say */
const VARIANT_OF={2:1,4:3,6:5,9:8,14:13,16:15,18:17,22:21,24:23,26:25,30:29,39:38,41:40,51:50,76:75,78:77,82:81,92:91,102:101,112:101,122:121};

/* single strokes the reader knows, by plain Roman spelling, with the Devanagari used when writing notation out */
const LEX={
  /* core bols */
  dha:"धा",dhin:"धिन",dhi:"धि",din:"दिन",dhe:"धे",dhet:"धेट",na:"ना",ta:"ता",tin:"तिन",tun:"तुन",tu:"तु",ti:"ति",te:"ते",
  tha:"था",thun:"थुन",da:"दा",ra:"रा",re:"रे",ri:"रि",di:"दि",de:"दे",den:"देन",ga:"गा",ge:"गे",ghe:"घे",ghi:"घि",ghin:"घिन",
  ghu:"घु",gu:"गु",ka:"क",ke:"के",ki:"कि",ku:"कु",kat:"कट",tak:"तक्",kta:"क्त",kda:"क्द",tra:"त्र",tta:"ट्ट",thak:"थक",thet:"थेत",
  /* single strokes from the compound list */
  kri:"क्रि",kre:"क्रे",kran:"क्रान",dhum:"धुम",
  /* parts of compounds that aren't rows of their own (Dhin-gi-na, Ghene) */
  gi:"गि",ne:"ने",
  /* Kathak syllables and a few others the reader already knew */
  thei:"थेई",tat:"तत्",aa:"आ",tig:"तिग्",dig:"दिग",tan:"तां",kra:"क्र",dhun:"धुन",ni:"नि",gha:"घ",
  /* from the Kathak list */
  tram:"ट्रम",thung:"थुंग",lung:"लुंग",tho:"थो",jhi:"झि",jha:"झ",kuk:"कुक्",nak:"नक्",thar:"थर्",rang:"रंग्",va:"व",dum:"दुम्",

/* other spellings of one stroke */
const SPELL={dhey:"dhe",tey:"te",gey:"ge",ghey:"ghe",katt:"kat",dhuma:"dhum",thai:"thei",thay:"thei",they:"thei",theyi:"thei",khran:"kran",thho:"tho"};

   Tigdha is the usual Roman spelling of Tigda: his row 105 (Tigdha Dig Dig) is row 103 (Tigda) and row 104 (Dig Dig) */
const EXPAND={dhir:["dhi","ra"],tir:["ti","ra"],kit:["ki","ta"],tit:["ti","ta"],tigdha:["tig","da"]};
/* written only in some transcriptions, so a split that avoids them wins a tie */
const RARE=new Set(["tta","kta","kda"]);
const KATHAK=new Set(["thei","tat","aa","tig","dig","thun","tha","thung","tram","lung","tho","jhi","jha","kuk","nak","thar","rang","dum","ya"]);
const ALIAS={tirkit:"tirakita",tirakit:"tirakita",tirkita:"tirakita"};
const PIECES={};
Object.keys(LEX).forEach(k=>PIECES[k]=[k]);Object.keys(SPELL).forEach(k=>PIECES[k]=[SPELL[k]]);Object.keys(EXPAND).forEach(k=>PIECES[k]=EXPAND[k]);
const KEYS=Object.keys(PIECES).sort((a,b)=>b.length-a.length);
const GAPCH="-–—ऽ_";
const isGap=c=>c.length===1&&GAPCH.includes(c);

function normRoman(w){
  let s=String(w).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z]/g,"");
  if(ALIAS[s])s=ALIAS[s];
  return s.replace(/([^aeiou])aa/g,"$1a").replace(/([^aeiou])ee/g,"$1i").replace(/([^aeiou])oo/g,"$1u");
}
/* split a run of letters into known strokes, fewest pieces first; a vowel-only syllable (Aa) may only start a word */
function segment(s){
  if(!s)return [];
  if(s==="a"||s==="aa")return ["aa"];
  const n=s.length,best=new Array(n+1).fill(null);best[0]={c:0,o:[]};
  for(let i=0;i<n;i++){if(!best[i])continue;
    for(const k of KEYS){if(!s.startsWith(k,i))continue;if(i>0&&/^[aeiou]/.test(k))continue;
      const j=i+k.length,c=best[i].c+10+(RARE.has(k)?1:0);
      if(!best[j]||c<best[j].c)best[j]={c,o:best[i].o.concat(PIECES[k])};}}
  return best[n]?best[n].o:null;

/* Devanagari: split into syllables and spell them in plain Roman */

/* full notation -> {matras:[{slots:[{bol,start,dur,half}],cutHalf,src}], unknown:[]} */
const MARK=/^(x|o|0|[1-9]|1[0-6]|[x×]\d+|\d+[x×])$/i;

    if(/[\u0900-\u097F]/.test(String(text||""))&&isKathak(first))return parse(text,true);return first;}

/* display helpers */

  return (kathak===undefined?[false,true]:[!!kathak]).every(k=>{const t=tokens(str,k);return t.length===bs.length&&t.every((x,i)=>x.bol===bs[i]);});}

  if(cnt>1&&cnt===bs.length&&DEVA_FOR[bs.join(" ")])return DEVA_FOR[bs.join(" ")];

function toRoman(p){return p.matras.map(matraRoman).join(" ");}

/* ---------- tihai arithmetic ---------- */
const TAALS={
  teentaal:{name:"Teentaal",n:16,vib:[4,4,4,4],marks:["X","2","0","3"]},
  jhaptaal:{name:"Jhaptaal",n:10,vib:[2,3,2,3],marks:["X","2","0","3"]},
  rupak:{name:"Rupak",n:7,vib:[3,2,2],marks:["0","1","2"]},
  ektaal:{name:"Ektaal",n:12,vib:[2,2,2,2,2,2],marks:["X","0","2","0","3","4"]},

    if(ok&&Math.abs((ev[s+p].t-ev[s].t)-(ev[s+2*p].t-ev[s+p].t))<EPS)return {p,start:ev[s].t,span:rnd(ev[s+p].t-ev[s].t),fromStart:s===0};}

function tihai(o){
  const P=o.line.len,bols=o.line.ev.filter(e=>e.bol!=null);

  const reps=o.reps===9?9:3,gap=Math.max(0,+o.gap||0),N=o.n,start=+o.start||0;

function posText(pos){

const plainKey=s=>keyOf(String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"")).normalize("NFC");

  const romans=roman.split("/").map(s=>s.trim()).filter(Boolean),term=TERMS.has(n);

function cover(c){

}

function compBySlug(slug){const r=Object.values(S.comps).find(c=>c.slug===slug);return r?toComp(r):null;}
function allChors(){return Object.values(S.chors).map(r=>({id:r.id,ckey:r.id,owner:r.owner_id,comp:r.composition_id,title:r.title,about:r.about,price:+r.price,created:ts(r.created_at)})).sort((a,b)=>b.created-a.created);}
function myItems(){return Object.values(S.lic).filter(l=>l.buyer_id===S.uid).map(l=>({id:l.id,key:l.composition_id,kind:l.kind,chor:l.choreography_id,seller:l.seller_id,price:+l.price,at:ts(l.created_at)}));}
function levelsOf(aid){return Object.values(S.levels).filter(l=>l.academy_id===aid).sort((a,b)=>a.position-b.position||a.name.localeCompare(b.name));}
function releasedAt(lid){return Object.values(S.releases).filter(r=>r.level_id===lid).map(r=>r.composition_id);}
function toAcad(r){return {id:r.id,slug:r.slug,guru:r.owner_id,name:r.name,about:r.about,fee:+r.fee,open:r.open,levels:levelsOf(r.id).map(l=>({id:l.id,name:l.name,position:l.position,pieces:releasedAt(l.id)}))};}

function personByHandle(h){return Object.values(S.people).find(p=>p.handle===h)||null;}
function membersOf(aid){return Object.values(S.members).filter(m=>m.academy_id===aid);}
function myMembership(aid){return S.uid?S.members[aid+":"+S.uid]||null:null;}
function memberships(){ // academies I asked to join, and where I stand
  return Object.values(S.members).filter(m=>m.student_id===S.uid).map(m=>{const r=S.academies[m.academy_id];if(!r)return null;
    return {a:toAcad(r),lvl:m.level_id,status:m.status==="requested"?"pending":m.status};}).filter(Boolean);}
function levelPieces(a,lvlId){const ls=a.levels||[];const idx=ls.findIndex(l=>l.id===lvlId);if(idx<0)return [];const keys=new Set();ls.slice(0,idx+1).forEach(l=>(l.pieces||[]).forEach(k=>keys.add(k)));return [...keys];}

}

/* ---------------- data: loaded from Supabase, kept current with live updates ---------------- */
const TABLES={people:["people",r=>r.id],compositions:["comps",r=>r.id],choreographies:["chors",r=>r.id],academies:["academies",r=>r.id],
  academy_levels:["levels",r=>r.id],licences:["lic",r=>r.id],academy_members:["members",r=>r.academy_id+":"+r.student_id],
  academy_releases:["releases",r=>r.level_id+":"+r.composition_id]};
const keep=(t,row)=>{if(row){const [m,k]=TABLES[t];S[m][k(row)]=row;}return row;};
const drop=(t,row)=>{const [m,k]=TABLES[t];delete S[m][k(row)];};
const fill=(t,rows)=>{const [m,k]=TABLES[t];const o={};(rows||[]).forEach(r=>o[k(r)]=r);S[m]=o;};
async function loadPublic(){
  const names=["people","compositions","choreographies","academies","academy_levels"];
  const res=await Promise.all(names.map(t=>sb.from(t).select("*")).concat([sb.rpc("academy_stats")]));
  res.forEach(r=>{if(r.error)throw r.error;});
  names.forEach((t,i)=>fill(t,res[i].data));
  S.stats={};(res[names.length].data||[]).forEach(r=>S.stats[r.academy_id]=r.students);
  S.loaded.pub=true;
}
async function loadPrivate(){
  if(!S.uid){fill("licences",[]);fill("academy_members",[]);fill("academy_releases",[]);S.loaded.priv=true;return;}
  const names=["licences","academy_members","academy_releases"];
  const res=await Promise.all(names.map(t=>sb.from(t).select("*")));
  res.forEach(r=>{if(r.error)throw r.error;});
  names.forEach((t,i)=>fill(t,res[i].data));
  S.loaded.priv=true;
}
/* full notation: the database only returns it to the composer, licence holders and released students */
const notationWaits={};
function loadNotation(id,force){
  if(!force&&S.notation[id]!==undefined)return Promise.resolve(S.notation[id]);
  if(notationWaits[id])return notationWaits[id];
  return notationWaits[id]=sb.from("notation").select("bols").eq("composition_id",id).maybeSingle().then(({data,error})=>{
    delete notationWaits[id];if(error){console.error(error);return null;}S.notation[id]=data?data.bols:null;return S.notation[id];});
}
let liveCh=null,statsT=0;
function refreshStats(){clearTimeout(statsT);statsT=setTimeout(()=>sb.rpc("academy_stats").then(({data})=>{if(data){S.stats={};data.forEach(r=>S.stats[r.academy_id]=r.students);soon();}}),400);}
function live(){
  if(liveCh)return;
  liveCh=sb.channel("layakari-db");
  Object.keys(TABLES).forEach(t=>liveCh.on("postgres_changes",{event:"*",schema:"public",table:t},p=>{
    if(p.eventType==="DELETE"){if(p.old)drop(t,p.old);}else if(p.new)keep(t,p.new);
    if(t==="compositions"&&p.eventType==="UPDATE"&&p.new&&S.notation[p.new.id]!==undefined){delete S.notation[p.new.id];}
    if(t==="academy_members")refreshStats();
    soon();
  }));
  liveCh.subscribe();
}

/* ---------------- writes ---------------- */
function errText(e){
  const m=(e&&e.message)||"",c=e&&e.code;
  if(c==="42501"&&/row-level security|permission denied/i.test(m))return "You don't have permission to do that.";
  if(c==="23505")return "That already exists.";
  if(["P0001","P0002","42501","28000","22023"].includes(c)&&m)return m;
  if(/fetch|network/i.test(m))return "Couldn't reach Layakari. Check your connection and try again.";
  return "Couldn't save. Try again in a moment.";
}
/* run a database call; on failure say why and give back null */
async function run(call){const {data,error}=await call;if(error){console.error(error);toast(errText(error));return null;}return data===null?true:data;}

/* ---------------- audio ---------------- */
let ac,noise;
function ctx(){if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();const b=ac.createBuffer(1,ac.sampleRate*.2,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;noise=b;}if(ac.state==="suspended")ac.resume();return ac;}
function env(g,t,p,d){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(p,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+d);}
function bayan(t,v){const a=ctx(),o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(68,t+.25);env(g,t,.55*v,.55);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.6);}
function click(t,v,f){const a=ctx(),s=a.createBufferSource(),bp=a.createBiquadFilter(),g=a.createGain();s.buffer=noise;bp.type="bandpass";bp.frequency.value=f||1800;env(g,t,v,.05);s.connect(bp).connect(g).connect(a.destination);s.start(t);s.stop(t+.08);}
function dayan(t,f,d,v){const a=ctx();[[1,.32],[2.01,.16],[3.02,.08],[4.1,.05]].forEach(([m,amp])=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=f*m;env(g,t,amp*v,d/m*1.4);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);});click(t,.12*v,3200);}
function strike(bol,t,beat){const b=bol.toLowerCase();
  if(b==="–")return;
  if(b==="tirakita"){[0,.25,.5,.75].forEach((k,i)=>i%2?dayan(t+k*beat,470,.12,.6):click(t+k*beat,.35,1500));return;}
  if(b==="dhage"){bayan(t,1);dayan(t,440,.3,.8);bayan(t+beat/2,.7);return;}
  if(/^dh/.test(b)){bayan(t,1);dayan(t,440,/in|dhi/.test(b)?.55:.3,.9);return;}
  if(/^tin|^ti$|^tu/.test(b)){dayan(t,466,.6,.8);return;}
  if(/^kat|^ka|^ke|^ga/.test(b)){b.startsWith("ga")?bayan(t,.7):click(t,.5,1200);return;}
  dayan(t,440,.25,1);}
let timer=null;
function stop(){clearInterval(timer);timer=null;S.playing=null;S.beat=-1;paint();renderPlayer();syncPlay();}
function bpmOf(c){return S.bpm[c.key]||c.bpm||90;}
function play(key){
  if(S.playing===key){stop();return;}
  const c=comp(key);if(!c)return;stop();ctx();S.playing=key;
  const tl=TAALS[c.taal]||TAALS.teentaal;
  const tick=()=>{const cc=comp(key)||c;S.beat=(S.beat+1)%tl.n;strike(tl.bols[S.beat],ctx().currentTime+.02,60/bpmOf(cc));paint();};
  tick();timer=setInterval(tick,60000/bpmOf(c));renderPlayer();syncPlay();
}
function retempo(key){if(S.playing===key){const c=comp(key);clearInterval(timer);const tl=TAALS[c.taal]||TAALS.teentaal;timer=setInterval(()=>{S.beat=(S.beat+1)%tl.n;strike(tl.bols[S.beat],ctx().currentTime+.02,60/bpmOf(c));paint();},60000/bpmOf(c));}}
function paint(){document.querySelectorAll(".m").forEach(el=>el.classList.toggle("on",S.playing===el.dataset.k&&+el.dataset.i===S.beat));const pb=$("#pbeat");if(pb&&S.playing){const c=comp(S.playing);if(c){const tl=TAALS[c.taal]||TAALS.teentaal;pb.textContent=`${tl.name} · matra ${S.beat+1}/${tl.n} · ${tl.bols[S.beat]}`;}}}
function syncPlay(){document.querySelectorAll("[data-act=play]").forEach(b=>{const on=S.playing===b.dataset.k;b.innerHTML=on?I.pause:I.play;b.setAttribute("aria-label",on?"Pause theka":"Play theka");});}
function renderPlayer(){const el=$("#player");if(!S.playing){el.innerHTML="";return;}const c=comp(S.playing);if(!c){stop();return;}
  el.innerHTML=`<div class="player">${cover(c)}<div class="meta"><b>${esc(c.title)}</b><span id="pbeat">${esc(pname(c.owner))}</span></div><button data-act="play" data-k="${esc(c.key)}" aria-label="Pause theka">${I.pause}</button></div>`;}

/* ---------------- page links: every page has its own address ---------------- */
const VIEW_TITLES={discover:"Discover",library:"Library",bols:"Bols",academy:"Academy",studio:"Studio",profile:"Profile",notfound:"Page not found"};
function viewPath(v){return v==="landing"?"/":"/"+v;}
function bgPath(){if(S.view==="person"&&S.route)return "/u/"+S.route.handle;if(S.view==="school"&&S.route)return "/a/"+S.route.slug;return viewPath(S.view==="landing"||S.view==="notfound"?"discover":S.view);}
function go(path,opts){opts=opts||{};
  if(path!==location.pathname){const st={app:true};if(opts.replace)history.replaceState(st,"",path);else{history.pushState(st,"",path);if(/^\/c\//.test(path))S.detailPushed=true;}}
  route();if(!opts.keepScroll&&!/^\/c\//.test(path))window.scrollTo(0,0);}
function dropModal(){if(S.modal&&S.modal.kind!=="auth"){S.modal=null;S.confirm=null;}}
function route(){
  const p=(location.pathname.replace(/\/+$/,"")||"/").toLowerCase();let m;
  if(!/^\/c\//.test(p))S.detailPushed=false;
  S.route=null;
  if(p==="/"){S.view=S.uid?"discover":"landing";dropModal();}
  else if((m=p.match(/^\/(discover|library|bols|academy|studio|profile)$/))){S.view=m[1];dropModal();}
  else if((m=p.match(/^\/c\/([a-z0-9-]+)$/))){if(["landing","notfound"].includes(S.view))S.view="discover";S.modal={kind:"detail",slug:m[1]};S.confirm=null;}
  else if((m=p.match(/^\/u\/([a-z0-9-]+)$/))){S.view="person";S.route={handle:m[1]};dropModal();}
  else if((m=p.match(/^\/a\/([a-z0-9-]+)$/))){S.view="school";S.route={slug:m[1]};dropModal();}
  else{S.view="notfound";dropModal();}
  if(S.view==="landing"&&S.uid)S.view="discover";
  if(!S.uid&&!PUBLIC_VIEWS.has(S.view)&&S.view!=="landing"){S.authMode="in";S.authMsg="";}   // someone opening a private page most likely has an account
  render();renderModal();setTitle();
}
function setTitle(){
  let t="Layakari · Every composition finds its sam";
  if(S.modal&&S.modal.kind==="detail"){const c=compBySlug(S.modal.slug);if(c)t=`${c.title} · ${c.type} in ${(TAALS[c.taal]||{}).name||c.taal} by ${pname(c.owner)} · Layakari`;}

  else if(S.view==="school"&&S.route){const a=academyBySlug(S.route.slug);if(a)t=`${a.name} · Layakari`;}

function earnings(){

    else if(l.seller_id===S.uid&&l.buyer_id!==S.uid){share=price*.8;what=KIND[l.kind].n+" licence (80%)";by[l.kind]+=share;}
    if(share){tot+=share;rows.push({buyer:l.buyer_id,it:{price,at:ts(l.created_at)},share,what,c:l.composition_id?comp(l.composition_id):null,title:l.title});}
  }
  rows.sort((a,b)=>b.it.at-a.it.at);return {tot,by,rows};
}

/* ---------------- Bols: the dictionary every composition is read with ---------------- */
const BOL_F=[["all","All"],["core","Core"],["compound","Compound"],["kathak","Kathak"],["term","Terms"],["both","Both drums"],["treble","Treble drum"],["bass","Bass drum"]];
const BOL_G=[["core","Core bols"],["compound","Compound bols"],["kathak","Kathak bols"],["term","Kathak terms"]];
/* terms (Toda, Tihai…) name a form or a technique; they are never read as strokes */
const termKey=w=>String(w||"").normalize("NFC").toLowerCase().replace(/[^a-z\u0900-\u097F]/g,"");
let TERM_KEYS=null;
const isTermWord=w=>{if(!TERM_KEYS)TERM_KEYS=new Set(NT.DICT.filter(e=>e.term).flatMap(e=>e.romans.concat(e.devas)).map(termKey));return TERM_KEYS.has(termKey(w));};
const termOf=q=>{const L=NT.lookup(q);return L&&L.spelled.find(e=>e.term)||null;};
const DRUM={both:"Both drums",treble:"Treble drum",bass:"Bass drum"};
const bolRow=n=>NT.DICT[n-1];
const bolRef=e=>`<button type="button" class="lnk" data-act="bol-go" data-n="${e.n}">${e.n} ${esc(e.roman)}</button>`;
function bolCard(e,q){
  const strokes=e.bols.map(NT.bolName),showK=!e.term&&(strokes.length>1||strokes[0]!==e.roman);
  const plain=x=>String(x).toLowerCase().replace(/[\s\-–—]/g,""),qq=plain(q||"");
  const hit=v=>qq&&(plain(v.roman).includes(qq)||v.devas.some(d=>plain(d).includes(qq)));
  return `<article class="bol" id="bol-${e.n}">
    <div class="bol-h"><span class="bol-n">${e.n}</span><b class="bol-r">${esc(e.roman)}</b><span class="bol-d" lang="hi">${esc(e.deva)}</span></div>
    <p class="bol-note">${esc(e.note)}</p>
    ${showK?`<p class="bol-k"><span>${strokes.length} stroke${strokes.length===1?"":"s"}${e.matras>1?` in ${e.matras} matras`:""}:</span>${strokes.map(b=>`<i>${esc(b)}</i>`).join("")}</p>`:""}
    ${e.variants.map(bolRow).map(v=>`<div class="bol-v${hit(v)?" hit":""}"><span class="bol-n">${v.n}</span><b>${esc(v.roman)}</b><span lang="hi">${esc(v.deva)}</span><p class="bol-note">${esc(v.note)}</p></div>`).join("")}
    ${e.same.length?`<p class="bol-s">Same strokes as ${e.same.map(bolRow).map(bolRef).join(", ")}</p>`:""}
    ${e.drum?`<span class="pill ${e.drum==="both"?"gold":"teal"}">${DRUM[e.drum]}</span>`:""}${e.term?`<span class="pill">Term</span>`:""}
  </article>`;
}
function bolReading(q){
  const t=termOf(q);
  if(t)return `<div class="panel bol-read" role="status" aria-live="polite"><span class="eyebrow" style="margin:0">Kathak term</span>
    <p class="small">${bolRef(t)} names a ${esc(t.note.toLowerCase())}, so Layakari doesn't read it as strokes.</p></div>`;
  const L=NT.lookup(q);if(!L||!L.bols.some(b=>NT.LEX[b]))return "";
  const n=L.bols.length,list=es=>es.map(bolRef).join(", ");
  const kath=NT.flatBols(NT.parse(q,true)).map(NT.bolName).join(" "),here=L.bols.map(NT.bolName).join(" ");
  return `<div class="panel bol-read" role="status" aria-live="polite">
    <span class="eyebrow" style="margin:0">Layakari reads this as</span>
    <div class="bol-mats">${L.parsed.matras.map(m=>`<span class="bol-m">${m.slots.map(sl=>sl.bol==null?`<i>–</i>`:`<i${NT.LEX[sl.bol]?"":` class="unk"`}>${esc(NT.bolName(sl.bol))}</i>`).join("")}</span>`).join("")}</div>
    <p class="small muted">${n} stroke${n===1?"":"s"} in ${L.matras} matra${L.matras===1?"":"s"} · <span lang="hi">${esc(NT.toDeva(L.parsed))}</span></p>
    ${L.ambiguous?"":L.spelled.length?`<p class="small">In the dictionary as ${list(L.spelled)}.</p>`:L.same.length?`<p class="small">Same strokes as ${list(L.same)}.</p>`:""}
    ${L.ambiguous?`<p class="small">The dictionary gives this spelling for two bols: ${L.ambiguous.map(a=>list(a.rows.map(bolRow))).join(" and ")}. On its own Layakari reads it as ${esc(here)}${kath!==here?`, and in a Kathak composition as ${esc(kath)}`:""}.</p>`:""}
    ${L.unknown.length?`<p class="small bol-warn">Not in the dictionary yet: ${esc(L.unknown.join(", "))}</p>`:""}
  </div>`;
}
function vBols(){
  const q=S.bq.trim(),f=S.bolf,ok=e=>f==="all"||e.group===f||e.drum===f;
  const hits=new Set(NT.search(q).map(e=>e.of||e.n));
  if(q&&!termOf(q)){const p=NT.parse(q),key=bs=>bs.join(" "),want=new Set();
    p.matras.forEach(m=>{const bs=m.slots.filter(x=>x.bol!=null).map(x=>x.bol);if(bs.length)want.add(key(bs));bs.forEach(b=>want.add(b));});
    NT.DICT.forEach(e=>{if(want.has(key(e.bols)))hits.add(e.of||e.n);});}
  const mains=NT.DICT.filter(e=>!e.of&&hits.has(e.n)&&ok(e));
  const filtered=q||f!=="all";
  const rowsOf=g=>{const ns=NT.DICT.filter(e=>e.group===g).map(e=>e.n).sort((x,y)=>x-y),out=[];let a=ns[0],z=ns[0];
    for(const x of ns.slice(1).concat([null])){if(x!==null&&x===z+1){z=x;continue;}out.push(z>a?`${a}–${z}`:`${a}`);a=z=x;}return out.join(", ");};
  const count=(g,es)=>{if(filtered)return `${es.length} matching`;const v=NT.DICT.filter(e=>e.group===g&&e.of).length;
    return `Rows ${rowsOf(g)}`+(g==="term"?" · forms and techniques, not strokes":v?` · ${v} ${v===1?"is another spelling, shown with its":"are other spellings, shown with their"} bol`:"");};
  return `<p class="eyebrow">Bols</p><h1>The bol dictionary</h1><p class="lede">The core, compound and Kathak bols that compositions are built from. Layakari recognises every spelling here, in Roman or Devanagari, whenever you write the bols of a composition. Kathak terms like Toda and Tihai are listed at the end.</p>
  <label class="search">${I.search}<input id="bq" type="search" autocomplete="off" spellcheck="false" placeholder="Search, or type bols to see how they read: dheen, धीरे, dhagetirakita" value="${esc(S.bq)}" aria-label="Search the bols, or type bols to see how Layakari reads them"></label>
  ${q?bolReading(q):""}
  <div class="chips">${BOL_F.map(([k,l])=>`<button class="chip" data-act="bolf" data-f="${k}" aria-pressed="${f===k}">${l}</button>`).join("")}</div>
  ${BOL_G.map(([g,label])=>{const es=mains.filter(e=>e.group===g);return es.length?`<div class="sec"><h2>${label}</h2><span>${count(g,es)}</span></div><div class="bolgrid">${es.map(e=>bolCard(e,q)).join("")}</div>`:"";}).join("")}
  ${mains.length?"":`<div class="empty" style="margin-top:20px">No bols in the dictionary match${q?` “${esc(q)}”`:""}${f!=="all"?" with this filter":""}.${filtered?`<button class="btn sm ghost" data-act="bolf" data-f="all" data-clear="1">Show all bols</button>`:""}</div>`}`;
}
/* bols in a composition that aren't in the dictionary, from lines that are mostly bols (lyrics and notes are left alone) */
function bolsNotInDict(text){
  const out=new Set();
  String(text||"").split("\n").forEach(line=>{const words=line.replace(/\([^)]*\)/g," ").split(/[\s|।॥]+/).filter(w=>w&&/[A-Za-zऀ-ॿ]/.test(w)&&!/^(x|o|[x×]\d+|\d+[x×])$/i.test(w));
    if(!words.length)return;const bad=words.filter(w=>!isTermWord(w)&&NT.parse(w).unknown.length);
    if(bad.length&&bad.length<=words.length/2)bad.forEach(w=>NT.parse(w).unknown.forEach(u=>out.add(u)));});
  return [...out];
}

function openModal(kind,arg){if(kind==="auth"&&S.modal&&S.modal.kind==="detail")S.modalBack=S.modal;S.modal={kind,arg};S.confirm=null;renderModal();const f=$("#modal input:not([type=range]),#modal textarea,#modal button.bigplay");if(f)f.focus();}
function closeModal(){
  if(!S.modal)return;
  if(S.modal.kind==="detail"){closeDetail();return;}
  if(S.modal.kind==="auth"&&S.modalBack){S.modal=S.modalBack;S.modalBack=null;S.confirm=null;renderModal();return;}
  S.modal=null;S.confirm=null;renderModal();
  if(/^\/c\//.test(location.pathname)&&!S.modal)go(bgPath(),{replace:true,keepScroll:true});
}
function openAuth(mode){S.authMode=mode||"in";S.authMsg="";if(S.view==="landing"){render();const el=document.getElementById("au-email");if(el){el.scrollIntoView({block:"center"});el.focus({preventScroll:true});}return;}openModal("auth");}
function renderModal(){const m=$("#modal");if(!S.modal){m.hidden=true;m.innerHTML="";return;}
  const k=S.modal.kind,a=S.modal.arg;
  const body=k==="detail"?mDetail(S.modal.slug):k==="comp"?mComp(a):k==="chor"?mChor():k==="acad"?mAcad():k==="level"?mLevel(a):k==="profile"?profileForm(me()):k==="auth"?authForm(S.modalBack?(S.authMode==="up"?"Create a free account to licence this composition":"Sign in to licence this composition"):""):"";
  m.hidden=false;m.innerHTML=`<div class="modal" data-act="backdrop"><div class="dlg ${k==="detail"?"":"narrow"}" role="dialog" aria-modal="true"><button class="x" data-act="close" aria-label="Close">${I.x}</button>${body}</div></div>`;
  syncPlay();paint();cfUnknown();
  const dk=k==="detail"?(compBySlug(S.modal.slug)||{}).key:null;
  const r=$("#bpm");if(r&&dk)r.oninput=e=>{S.bpm[dk]=+e.target.value;$("#bpmv").textContent=e.target.value+" bpm";retempo(dk);};
  if(dk&&canRead(dk)&&S.notation[dk]===undefined)loadNotation(dk).then(()=>{if(S.modal&&S.modal.kind==="detail")renderModal();});
  if(k==="detail")setTitle();
}

  if(S.view==="landing"){side.hidden=true;main.innerHTML=vLanding();setupLanding();return;}
  demoStop();

function confirmOnce(tag){if(S.confirm===tag){S.confirm=null;return true;}S.confirm=tag;return false;}
const needAccount=()=>{if(S.uid)return false;openAuth("up");return true;};
document.addEventListener("click",async e=>{
  const ln=e.target.closest("a[data-link]");
  if(ln&&e.button===0&&!e.metaKey&&!e.ctrlKey&&!e.shiftKey&&!e.altKey){e.preventDefault();const href=ln.getAttribute("href");
    if(S.modal&&!["detail","auth"].includes(S.modal.kind)){S.modal=null;S.confirm=null;}
    if(S.modal&&S.modal.kind==="auth"){S.modal=null;S.modalBack=null;}
    go(href);return;}
  const t=e.target.closest("[data-act]");if(!t)return;const d=t.dataset,act=d.act;
  if(act==="backdrop"){if(e.target===t)closeModal();return;}
  if(act==="demo-play"){demoPlay();return;}
  if(act==="to-how"){const h=document.getElementById("how");if(h)h.scrollIntoView({block:"start"});return;}
  if(act==="to-signup"){if(S.authMode!=="up"){S.authMode="up";S.authMsg="";demoStop();render();}window.scrollTo({top:0,behavior:"smooth"});setTimeout(()=>{const el=document.getElementById("au-email");if(el)el.focus({preventScroll:true});},300);return;}
  if(act==="auth-mode"){demoStop();S.authMode=S.authMode==="up"?"in":"up";S.authMsg="";if(S.modal&&S.modal.kind==="auth")renderModal();else render();return;}
  if(act==="auth"){openAuth(d.mode);return;}
  if(act==="signout"){stop();sb.auth.signOut().finally(()=>location.assign("/"));return;}
  if(act==="close"){closeModal();return;}
  if(act==="share"){share(d.path,d.title);return;}
  if(act==="nav"){S.confirm=null;if(S.modal&&S.modal.kind!=="detail")S.modal=null;go(viewPath(d.v));return;}
  if(act==="taal"){S.taal=d.t;render();return;}
  if(act==="bolf"){S.bolf=d.f;if(d.clear)S.bq="";render();return;}
  if(act==="bol-go"){const r=NT.DICT[+d.n-1],to=r&&(r.of||r.n);S.bq="";S.bolf="all";if(S.view!=="bols"){S.modal=null;go("/bols");}else render();const el=document.getElementById("bol-"+to);if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1600);}return;}
  if(act==="open"){const c=comp(d.k);if(c)go("/c/"+c.slug);return;}
  if(act==="play"){e.stopPropagation();play(d.k);return;}
  if(act==="buy"){if(needAccount())return;const c=comp(d.k);if(!c)return;t.disabled=true;
    const row=await run(sb.rpc("demo_buy",{p_composition:c.key,p_kind:d.kind}));
    if(row&&row.id){keep("licences",row);delete S.notation[c.key];toast(`${KIND[d.kind].n} licence added for ${c.title}. Demo: no payment taken.`);await loadNotation(c.key,true);}
    renderModal();return;}
  if(act==="buych"){if(needAccount())return;const ch=allChors().find(x=>x.id===d.c);if(!ch)return;t.disabled=true;
    const row=await run(sb.rpc("demo_buy",{p_composition:ch.comp,p_kind:"choreo",p_choreography:ch.id}));
    if(row&&row.id){keep("licences",row);delete S.notation[ch.comp];toast(`Licensed "${ch.title}". Demo: no payment taken.`);await loadNotation(ch.comp,true);}
    renderModal();return;}
  if(act==="join"){if(needAccount())return;t.disabled=true;
    const row=await run(sb.from("academy_members").insert({academy_id:d.a,student_id:S.uid}).select().single());
    if(row&&row.academy_id){keep("academy_members",row);toast("Request sent. The guru will place you in a level.");}render();return;}
  if(act==="leave"){const ok=await run(sb.from("academy_members").delete().match({academy_id:d.a,student_id:S.uid}));
    if(ok){drop("academy_members",{academy_id:d.a,student_id:S.uid});await loadPrivate();toast("Removed.");}render();return;}
  if(act==="acad-form"){openModal("acad");return;}
  if(act==="acad-open"){const a=myAcademy();if(!a)return;const row=await run(sb.from("academies").update({open:a.open===false}).eq("id",a.id).select().single());if(row&&row.id)keep("academies",row);render();return;}
  if(act==="lvl"){S.selLvl=d.l;S.confirm=null;render();return;}
  if(act==="lvl-form"){openModal("level",d.l);return;}
  if(act==="lvl-del"){if(!confirmOnce("lvl:"+d.l)){render();return;}
    const ok=await run(sb.rpc("delete_level",{p_level:d.l}));
    if(ok){drop("academy_levels",{id:d.l});Object.values(S.releases).filter(r=>r.level_id===d.l).forEach(r=>drop("academy_releases",r));await loadPrivate();toast("Level deleted. Its students moved to the first level.");}render();return;}
  if(act==="piece"){const lv=S.selLvl;if(!lv)return;const k=lv+":"+d.k;t.disabled=true;
    if(S.releases[k]){const ok=await run(sb.from("academy_releases").delete().match({level_id:lv,composition_id:d.k}));if(ok)drop("academy_releases",{level_id:lv,composition_id:d.k});}
    else{const row=await run(sb.from("academy_releases").insert({level_id:lv,composition_id:d.k}).select().single());if(row&&row.level_id)keep("academy_releases",row);}
    render();return;}
  if(act==="approve"){const a=myAcademy();const s=$("#ap-"+CSS.escape(d.s));const lv=s&&s.value;if(!a||!lv)return;
    const row=await run(sb.from("academy_members").update({status:"active",level_id:lv}).match({academy_id:a.id,student_id:d.s}).select().single());
    if(row&&row.academy_id){keep("academy_members",row);toast(`${pname(d.s)} joined your academy.`);}render();return;}
  if(act==="decline"){const a=myAcademy();if(!a)return;
    const row=await run(sb.from("academy_members").update({status:"declined"}).match({academy_id:a.id,student_id:d.s}).select().single());
    if(row&&row.academy_id)keep("academy_members",row);render();return;}
  if(act==="remove"){if(!confirmOnce("rm:"+d.s)){render();return;}const a=myAcademy();if(!a)return;
    const ok=await run(sb.from("academy_members").delete().match({academy_id:a.id,student_id:d.s}));
    if(ok){drop("academy_members",{academy_id:a.id,student_id:d.s});toast(`${pname(d.s)} removed.`);}render();return;}
  if(act==="comp-form"){if(d.id&&S.notation[d.id]===undefined)await loadNotation(d.id);openModal("comp",d.id);return;}
  if(act==="comp-del"){if(!confirmOnce("comp:"+d.id)){renderModal();return;}if(S.playing===d.id)stop();
    const was=comp(d.id);const ok=await run(sb.from("compositions").delete().eq("id",d.id));
    if(ok){drop("compositions",{id:d.id});delete S.notation[d.id];
      Object.values(S.chors).filter(c=>c.composition_id===d.id).forEach(c=>drop("choreographies",c));
      Object.values(S.releases).filter(r=>r.composition_id===d.id).forEach(r=>drop("academy_releases",r));
      S.modal=null;S.confirm=null;renderModal();toast("Composition deleted.");
      if(was&&location.pathname==="/c/"+was.slug)go(S.view==="discover"?"/studio":bgPath(),{replace:true});else render();}
    return;}
  if(act==="samples"){t.disabled=true;let n=0;
    for(let i=SAMPLES.length-1;i>=0;i--){const s=SAMPLES[i];
      const row=await run(sb.rpc("save_composition",{p_id:null,p_title:s.title,p_form:s.type,p_taal:s.taal,p_laya:s.laya,p_bpm:s.bpm,p_bols:s.bols,
        p_price_listen:2,p_price_perform:[25,20,15,25,15,10][i],p_price_teach:[99,79,69,99,69,49][i]}));
      if(!row||!row.id)break;keep("compositions",row);S.notation[row.id]=s.bols;n++;}
    if(n)toast(`${n} sample composition${n===1?"":"s"} added to your catalogue.`);render();return;}
  if(act==="ch-form"){openModal("chor");return;}
  if(act==="ch-del"){if(!confirmOnce("ch:"+d.id)){render();return;}const ok=await run(sb.from("choreographies").delete().eq("id",d.id));if(ok)drop("choreographies",{id:d.id});render();return;}
  if(act==="prof-form"){openModal("profile");return;}
});

        if(!data.session)return done("Almost there: check your email and click the confirmation link, then sign in here.");
        done("");});}
    else{sb.auth.signInWithPassword({email,password}).then(({error})=>{if(error)return done(error.message==="Invalid login credentials"?"That email and password don't match. Try again or create an account.":error.message);done("");});}
    return;}
  if(btn)btn.disabled=true;
  const again=()=>{if(btn)btn.disabled=false;};
  if(kind==="profile"){const prof={name:v("pf-name"),city:v("pf-city"),bio:v("pf-bio"),roles:ROLES.map(r=>r[0]).filter(k=>document.getElementById("pf-r-"+k).checked)};if(!prof.name)return again();
    if(S.gate==="onboard"){const row=await run(sb.from("people").insert(Object.assign({id:S.uid},prof)).select().single());if(!row||!row.id)return again();
      keep("people",row);S.gate=null;
      const to=location.pathname!=="/"?location.pathname:prof.roles.includes("composer")?"/studio":prof.roles.includes("guru")?"/academy":"/discover";
      go(to,{replace:true});toast("Profile created. Welcome to Layakari.");return;}
    const row=await run(sb.from("people").update(prof).eq("id",S.uid).select().single());if(!row||!row.id)return again();
    keep("people",row);closeModal();render();toast("Profile saved.");return;}
  if(kind==="comp"){const id=f.dataset.id||null;const bols=document.getElementById("cf-bols").value.replace(/\s+$/,"");
    const args={p_id:id,p_title:v("cf-title"),p_form:v("cf-type"),p_taal:v("cf-taal"),p_laya:v("cf-laya"),p_bpm:Math.min(240,Math.max(30,parseInt(v("cf-bpm"))||90)),p_bols:bols,
      p_price_listen:num(v("cf-pl"),2),p_price_perform:num(v("cf-pp"),25),p_price_teach:num(v("cf-pt"),99)};if(!args.p_title)return again();
    const row=await run(sb.rpc("save_composition",args));if(!row||!row.id)return again();
    keep("compositions",row);S.notation[row.id]=bols;closeModal();render();toast(id?"Composition saved.":"Composition published.");return;}
  if(kind==="chor"){const data={owner_id:S.uid,composition_id:v("ch-comp"),title:v("ch-title"),price:num(v("ch-price"),49),about:v("ch-about")};if(!data.title||!data.composition_id)return again();
    const row=await run(sb.from("choreographies").insert(data).select().single());if(!row||!row.id)return again();
    keep("choreographies",row);closeModal();render();toast("Choreography published and linked.");return;}
  if(kind==="acad"){const data={name:v("ac-name"),about:v("ac-about"),fee:num(v("ac-fee"),0)};if(!data.name)return again();const a=myAcademy();
    if(a){const row=await run(sb.from("academies").update(data).eq("id",a.id).select().single());if(!row||!row.id)return again();keep("academies",row);}
    else{const row=await run(sb.rpc("create_academy",{p_name:data.name,p_about:data.about,p_fee:data.fee}));if(!row||!row.id)return again();keep("academies",row);
      const lv=await run(sb.from("academy_levels").select("*").eq("academy_id",row.id));if(Array.isArray(lv))lv.forEach(l=>keep("academy_levels",l));
      const mine=await run(sb.from("people").select("*").eq("id",S.uid).single());if(mine&&mine.id)keep("people",mine);}
    closeModal();render();toast(data.name+" is ready.");return;}
  if(kind==="level"){const id=f.dataset.id,name=v("lv-name");const a=myAcademy();if(!name||!a)return again();
    if(id){const row=await run(sb.from("academy_levels").update({name}).eq("id",id).select().single());if(!row||!row.id)return again();keep("academy_levels",row);}
    else{const pos=Math.max(-1,...a.levels.map(l=>l.position))+1;const row=await run(sb.from("academy_levels").insert({academy_id:a.id,name,position:pos}).select().single());if(!row||!row.id)return again();keep("academy_levels",row);S.selLvl=row.id;}
    closeModal();render();return;}
});

/* ---------------- boot ---------------- */
async function afterSignIn(){
  try{await loadPrivate();}catch(e){console.error(e);toast("Couldn't load your library. Check your connection and refresh.");}
  if(!S.people[S.uid]){const {data}=await sb.from("people").select("*").eq("id",S.uid).maybeSingle();if(data)keep("people",data);}
  if(!S.people[S.uid]){S.gate="onboard";S.modal=null;renderModal();render();return;}
  S.gate=null;
  if(S.modal&&S.modal.kind==="auth"){S.modal=S.modalBack;S.modalBack=null;}
  route();
}
async function signedIn(session){
  S.user=session.user;S.uid=session.user.id;S.notation={};
  if(!S.loaded.pub){try{await loadPublic();}catch(e){console.error(e);}}
  await afterSignIn();
  if(liveCh){sb.removeChannel(liveCh);liveCh=null;}live();
}
async function boot(){
  render();
  if(SUPABASE_URL.startsWith("PASTE")){document.getElementById("main").innerHTML=`<div class="wrap"><div class="empty"><b>Almost ready</b>Add your Supabase Project URL and publishable key at the top of the script in index.html.</div></div>`;return;}
  window.addEventListener("popstate",()=>{if(!S.gate)route();});
  const {data}=await sb.auth.getSession();
  const session=data&&data.session;
  if(session){S.user=session.user;S.uid=session.user.id;}
  try{await loadPublic();}catch(e){console.error(e);toast("Couldn't load Layakari. Check your connection and refresh.");}
  if(S.uid)await afterSignIn();else{S.gate=null;route();}
  live();
  sb.auth.onAuthStateChange((ev,s)=>{setTimeout(()=>{if(ev==="SIGNED_OUT"){location.assign("/");return;}if(s&&s.user&&s.user.id!==S.uid)signedIn(s);},0);});
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!S.gate)refresh();});
}
boot();
})();
</script>
</body>
</html>
