<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Layakari · Kathak and tabla compositions, academies and practice</title>
<meta name="description" content="A home for Kathak and tabla artists. Composers publish and license their work, gurus run their academies, and students practise every piece with full notation and a live theka.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Layakari">
<meta property="og:title" content="Layakari · Every composition finds its sam">
<meta property="og:description" content="Publish, license, teach and practise Kathak and tabla compositions, with notation and a live theka.">
<meta property="og:url" content="https://layakari.ca">
<meta name="theme-color" content="#2A1B33">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232A1B33'/%3E%3Ccircle cx='16' cy='17' r='9' fill='none' stroke='%23E8A33D' stroke-width='2.4'/%3E%3Ccircle cx='16' cy='8' r='3' fill='%23E8A33D'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Mukta:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: web app shell, left sidebar nav + scrolling main column; sidebar becomes a bottom tab bar on phones. Modal for detail and forms. */
:root{
  --bg:#F4F0F6; --surface:#FFFFFF; --surface2:#EEE7F1; --ink:#22182A; --muted:#6B5E74; --line:#E0D7E5;
  --gold:#A4580F; --gold-ink:#FFFFFF; --gold-soft:#F6E7D6; --teal:#1E7A6E; --teal-soft:#DDF0EC; --danger:#B23A4E;
  --hero1:#2A1B33; --hero2:#5A2E4E; --on-hero:#F6EFF8; --on-hero-mut:#CDBBD6; --beat:#E8A33D; --beat-ink:#241405;
  --display:"Rozha One", Georgia, serif; --body:"Mukta", system-ui, -apple-system, "Segoe UI", sans-serif; --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --shadow:0 18px 50px -20px rgba(40,15,50,.35);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#151019;--surface:#1E1725;--surface2:#2A2033;--ink:#F1E9F5;--muted:#A99BB3;--line:#33293D;--gold:#E8A33D;--gold-ink:#241405;--gold-soft:#3A2A1A;--teal:#57C9B9;--teal-soft:#1B3330;--danger:#F07A8D;--shadow:0 18px 50px -20px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151019;--surface:#1E1725;--surface2:#2A2033;--ink:#F1E9F5;--muted:#A99BB3;--line:#33293D;--gold:#E8A33D;--gold-ink:#241405;--gold-soft:#3A2A1A;--teal:#57C9B9;--teal-soft:#1B3330;--danger:#F07A8D;--shadow:0 18px 50px -20px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:4px;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface)}
.brand{font:400 26px var(--display);padding:0 10px 16px;display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px;color:var(--gold)}
.nav{display:flex;align-items:center;gap:10px;background:none;border:0;padding:9px 10px;border-radius:10px;text-align:left;font-weight:500;color:var(--muted)}
.nav svg{width:20px;height:20px;flex:none}
.nav:hover{background:var(--surface2);color:var(--ink)}
.nav[aria-current="page"]{background:var(--gold-soft);color:var(--gold)}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--line)}
.me img{width:32px;height:32px;border-radius:50%}
.me b{display:block;font-size:15px;line-height:1.2}
.me span{font-size:13.5px;color:var(--muted)}
main{min-width:0;padding-inline:clamp(16px,4vw,48px);padding-block:28px 140px}
.wrap{max-width:1080px;margin:0 auto}
.app.gated{grid-template-columns:minmax(0,1fr)}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);z-index:20}
  .brand,.me{display:none}
  .nav{flex-direction:column;gap:2px;font-size:12.5px;padding:6px 4px;flex:1;align-items:center}
  main{padding-block:20px 170px}
}
h1{font:400 clamp(30px,4.2vw,42px)/1.08 var(--display);margin:0 0 6px;text-wrap:balance}
h2{font:400 24px/1.15 var(--display);margin:0;text-wrap:balance}
h3{font-size:17.5px;margin:0;font-weight:600}
.lede{color:var(--muted);margin:0;max-width:62ch}
.eyebrow{font-family:var(--mono);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:0 0 8px}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:34px 0 14px;flex-wrap:wrap}
.sec span{color:var(--muted);font-size:14.5px}
.muted{color:var(--muted)}
.small{font-size:14.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:10px;padding:8px 14px;font-weight:600;font-size:15.5px;background:var(--gold);color:var(--gold-ink);white-space:nowrap}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
a.btn{text-decoration:none}
.land-abhyas{margin:0;color:var(--on-hero-mut);font-size:16px}
.land-abhyas a{color:var(--beat);font-weight:600;text-underline-offset:3px}
.foot a{color:inherit;text-underline-offset:3px}
.btn.ghost:hover{background:var(--surface2)}
.btn.sm{padding:5px 10px;font-size:14.5px;border-radius:8px}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-top:18px;max-width:560px}
.search input{flex:1;border:0;background:none;outline:none;min-width:0}
.search svg{width:16px;height:16px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:14.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}
.card{background:none;border:0;padding:0;text-align:left;min-width:0}
.cover{width:100%;aspect-ratio:1;max-width:100%;border-radius:14px;display:block}
.card b{display:block;margin-top:8px;font-size:16px;line-height:1.25}
.card span{font-size:14px;color:var(--muted);display:block}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .cover{width:52px;flex:none;border-radius:10px}
.li .meta{flex:1;min-width:0}
.li .meta b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .meta span{font-size:14px;color:var(--muted)}
.li button.meta{background:none;border:0;padding:0;text-align:left}
.li .meta .prog{display:block;font-family:var(--mono);font-size:12.5px;color:var(--teal);margin-top:2px}
.li .meta .prog.none{color:var(--muted)}
.li .meta .passed{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.li .meta .pill{font-size:12.5px}
.li .meta .pill.teal{color:var(--teal)}
@media (max-width:600px){.li.stu{flex-wrap:wrap}.li.stu .meta{flex-basis:calc(100% - 52px)}.li.stu>.row-actions{width:100%;justify-content:flex-end}}
.prac{font-size:14.5px;color:var(--muted);margin:8px 0 0}
.pill{display:inline-block;font-family:var(--mono);font-size:12.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.gold{border-color:var(--gold);color:var(--gold)}
.pill.teal{border-color:var(--teal);color:var(--teal)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:400 17px var(--display);color:#fff;flex:none}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.acad{display:flex;flex-direction:column;gap:8px}
.acad .top{display:flex;gap:12px;align-items:center}
.acad p{margin:0;font-size:15px;color:var(--muted)}
.hero{border-radius:20px;padding:22px;background:radial-gradient(120% 120% at 100% 0%,var(--hero2) 0%,var(--hero1) 60%);color:var(--on-hero)}
.hero .k{font-family:var(--mono);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--beat)}
.hero b.big{display:block;font:400 40px/1.1 var(--display);margin:4px 0}
.hero p{margin:0;color:var(--on-hero-mut);font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile span{display:block;font-size:14px;color:var(--muted)}
.tile b{font-family:var(--mono);font-weight:500;font-size:19px;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
th{font-family:var(--mono);font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:500}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:14.5px;white-space:nowrap}
.empty{border:1px dashed var(--line);border-radius:16px;padding:26px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty b{color:var(--ink);font-size:17.5px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-weight:600;font-size:15px}
.tab[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft);color:var(--gold)}
.tab small{font-family:var(--mono);font-weight:400;color:var(--muted);margin-left:4px}
.sw{width:42px;height:24px;border-radius:999px;border:0;background:var(--surface2);position:relative;flex:none;box-shadow:inset 0 0 0 1px var(--line)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--teal)}
.sw[aria-checked="true"]::after{transform:translateX(18px);background:#fff}
.sw[disabled]{opacity:.4;cursor:not-allowed}
select.inline{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 8px;font-size:14.5px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(15,8,20,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(5vh,16px) 16px;overflow-y:auto;z-index:40}
.dlg{width:min(720px,100%);background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:22px;position:relative}
.dlg.narrow{width:min(520px,100%)}
#modal .dlg:focus,#main:focus{outline:none}
.x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:0;background:var(--surface2);display:grid;place-items:center}
.x svg{width:16px;height:16px}
.det{display:grid;grid-template-columns:180px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:600px){.det{grid-template-columns:minmax(0,1fr)}.det .cover{max-width:180px}}
.meta-line{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.taal{margin-top:18px;background:var(--hero1);color:var(--on-hero);border-radius:16px;padding:14px}
.taal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:14.5px}
.taal-head span{font-family:var(--mono);font-size:12.5px;color:var(--on-hero-mut)}
.beats{display:grid;gap:5px}
.m{position:relative;background:rgba(255,255,255,.07);border-radius:8px;padding:15px 2px 6px;text-align:center;font-size:13.5px;line-height:1.1;min-width:0;overflow:hidden}
.m small{position:absolute;top:2px;left:0;right:0;font-family:var(--mono);font-size:11px;color:var(--on-hero-mut)}
.m.vs small{color:var(--beat)}
.m.sam{box-shadow:inset 0 0 0 1px var(--beat)}
.m.on{background:var(--beat);color:var(--beat-ink)}
.m.on small{color:var(--beat-ink)}
.ctrl{display:flex;align-items:center;gap:14px;margin-top:12px}
.bigplay{width:46px;height:46px;border-radius:50%;border:0;background:var(--beat);color:var(--beat-ink);display:grid;place-items:center;flex:none}
.bigplay svg{width:22px;height:22px}
.ctrl label{flex:1;font-size:13.5px;color:var(--on-hero-mut);display:flex;flex-direction:column}
.ctrl input{accent-color:var(--beat);width:100%}
.bols{margin-top:12px;font-family:var(--mono);font-size:14px;line-height:1.7;background:rgba(0,0,0,.25);border-radius:12px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.lock{color:var(--on-hero-mut);font-family:var(--body);font-size:14px;margin-top:6px}
.lic{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}
.lic-opt{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:2px}
.lic-opt b{font-size:15.5px}
.lic-opt span{font-size:13.5px;color:var(--muted)}
.lic-opt em{font-style:normal;font-family:var(--mono);font-size:15.5px;margin-top:6px}
.lic-opt.owned{border-color:var(--teal);background:var(--teal-soft)}
.lic-opt.owned em{color:var(--teal)}
.access{display:inline-flex;gap:6px;align-items:center;font-size:14.5px;color:var(--teal);font-weight:600;margin-top:12px}
.access svg{width:16px;height:16px;flex:none}
/* forms */
form .f{display:flex;flex-direction:column;gap:4px;margin-top:12px;font-size:14.5px;color:var(--muted);font-weight:500}
form .f input,form .f select,form .f textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;color:var(--ink);font-size:16px;font-weight:400}
form .f textarea{min-height:96px;font-family:var(--mono);font-size:14.5px}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0 12px}
.roles{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.roles label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:15px;color:var(--ink);cursor:pointer}
.roles input{accent-color:var(--gold)}
.form-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.gate{min-height:80vh;display:grid;place-items:center;padding:16px}
.gate .dlg{box-shadow:var(--shadow)}
[hidden]{display:none!important}
.app.gated main{padding:0}
.app.gated .gate{min-height:100vh}
/* landing */
.land{position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-rows:auto 1fr;grid-template-areas:"copy auth" "feats auth";min-height:100vh;isolation:isolate}
.land::before{content:"";position:absolute;top:0;left:0;right:0;bottom:-160px;z-index:-1;background:radial-gradient(60% 55% at 85% 35%,rgba(232,163,61,.10) 0%,transparent 60%),radial-gradient(70% 70% at 55% 0%,var(--hero2) 0%,transparent 70%),radial-gradient(60% 60% at 0% 90%,#3E2443 0%,transparent 70%),var(--hero1);-webkit-mask-image:linear-gradient(to bottom,#000 0,#000 calc(100% - 170px),transparent 100%);mask-image:linear-gradient(to bottom,#000 0,#000 calc(100% - 170px),transparent 100%)}
.land-copy{grid-area:copy;color:var(--on-hero);padding:clamp(28px,5vw,64px) clamp(20px,5vw,64px) 0;display:flex;flex-direction:column;gap:18px}
.land-brand{display:flex;align-items:center;gap:10px;font:400 26px var(--display);color:var(--on-hero)}
.land-brand svg{width:28px;height:28px;color:var(--beat)}
.land-copy .k{font-family:var(--mono);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--beat);margin:clamp(12px,4vh,40px) 0 0}
.land-copy h1{font:400 clamp(36px,5.2vw,64px)/1.02 var(--display);margin:0;max-width:15ch;color:var(--on-hero)}
.land-copy h1 em{font-style:normal;color:var(--beat)}
.land-copy .lede{color:var(--on-hero-mut);font-size:clamp(16.5px,1.4vw,18.5px);max-width:46ch;margin:0}
.land-row{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.land-ring{width:clamp(120px,14vw,170px);flex:none}
.land-ring circle.d{fill:rgba(246,239,248,.16);animation:matra 8s steps(1) infinite}
.land-ring circle.vib{fill:none;stroke:rgba(246,239,248,.45);stroke-width:1.2}
.land-ring circle.sam{fill:var(--beat)}
@keyframes matra{0%{fill:var(--beat)}6.25%,100%{fill:rgba(246,239,248,.16)}}
.land-ring circle.sam{animation-name:sammatra}
@keyframes sammatra{0%{fill:#fff}6.25%,100%{fill:var(--beat)}}
.land-ring text{font:400 15px var(--display);fill:var(--on-hero)}
.land-ring .bol{font:500 7.5px var(--mono);fill:var(--on-hero-mut);letter-spacing:.08em}
.land-legend{font-family:var(--mono);font-size:12.5px;color:var(--on-hero-mut);line-height:1.7}
.land-legend b{color:var(--on-hero);font-weight:500}
.land-feats{grid-area:feats;list-style:none;margin:0;padding:clamp(24px,4vh,40px) clamp(20px,5vw,64px) clamp(28px,5vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:14px;align-content:end}
.land-feats li{border:1px solid rgba(246,239,248,.14);background:rgba(255,255,255,.04);border-radius:16px;padding:14px 16px;color:var(--on-hero-mut);font-size:15px;line-height:1.45}
.land-feats b{display:block;color:var(--on-hero);font:400 18px var(--display);margin-bottom:4px}
.land-feats span.tag{display:inline-block;font-family:var(--mono);font-size:12px;color:var(--beat);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.land-auth{grid-area:auth;display:grid;place-items:center;padding:clamp(20px,4vw,56px)}
.land-auth .dlg{box-shadow:var(--shadow);width:min(440px,100%)}
.land-auth .fine{font-size:13.5px;color:var(--muted);margin:14px 0 0;text-align:center}
@media (max-width:900px){
  .land{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;grid-template-areas:"copy" "auth" "feats"}
  .land-copy{padding-bottom:20px}
  .land-copy .k{margin-top:4px}
  .land-auth{padding:20px 16px;margin-top:-1px}
  .land-feats{padding-top:20px}
}
@media (prefers-reduced-motion: reduce){.land-ring circle.d{animation:none}}
.land{min-height:calc(100vh - 64px)}
.land-auth .reassure{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin:12px 0 0;padding:0;list-style:none;font-size:14px;color:var(--muted)}
.land-auth .reassure li::before{content:"✓ ";color:var(--teal);font-weight:700}
.more{padding:clamp(40px,7vw,88px) clamp(16px,5vw,64px);max-width:1180px;margin:0 auto}
.more + .more{padding-top:0}
.more h2.sh{font:400 clamp(28px,3.4vw,40px)/1.1 var(--display);margin:0 0 8px;text-wrap:balance}
.more .sl{color:var(--muted);margin:0 0 26px;max-width:60ch}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:16px;counter-reset:st;margin:0;padding:0;list-style:none}
.steps li{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;counter-increment:st}

];

    `<div class="rec-ctl row-actions"><label class="small muted">Bols per matra <select class="inline" id="rec-sub">${[1,2,3,4].map(k=>`<option ${k===sub?"selected":""}>${k}</option>`).join("")}</select></label><button type="button" class="btn sm ghost" data-act="rec-realign">Re-align</button></div>${recSvg(r,sub)}`);

let q=Promise.resolve();

function queue(fn){q=q.then(fn).catch(e=>{if(e&&e.code==="invalid_argument")S.readOnly=true;toast(errText(e));render();});return q;}
const clone=o=>JSON.parse(JSON.stringify(o||{}));

function saveEnroll(mut){const e=clone(S.enrolls[S.uid]);e.req=e.req||{};mut(e);S.enrolls[S.uid]=e;render();const ref=S.db.doc("enroll/"+S.uid);return queue(()=>ref.set(e));}
function capturePasses(){ // copy pieces from levels a guru marked as passed into my own record, so they stay mine

  if(Object.keys(add).length)saveEnroll(e=>{e.kept=Object.assign(e.kept||{},add);});

/* ---------------- audio ---------------- */
let ac,noise;
function ctx(){if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();const b=ac.createBuffer(1,ac.sampleRate*.2,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;noise=b;}if(ac.state==="suspended")ac.resume();return ac;}
function env(g,t,p,d){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(p,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+d);}
function bayan(t,v){const a=ctx(),o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(68,t+.25);env(g,t,.55*v,.55);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.6);}
function click(t,v,f){const a=ctx(),s=a.createBufferSource(),bp=a.createBiquadFilter(),g=a.createGain();s.buffer=noise;bp.type="bandpass";bp.frequency.value=f||1800;env(g,t,v,.05);s.connect(bp).connect(g).connect(a.destination);s.start(t);s.stop(t+.08);}
function dayan(t,f,d,v){const a=ctx();[[1,.32],[2.01,.16],[3.02,.08],[4.1,.05]].forEach(([m,amp])=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=f*m;env(g,t,amp*v,d/m*1.4);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);});click(t,.12*v,3200);}
function strike(bol,t,beat){const b=bol.toLowerCase();
  if(b==="–")return;
  if(b==="tirakita"){[0,.25,.5,.75].forEach((k,i)=>i%2?dayan(t+k*beat,470,.12,.6):click(t+k*beat,.35,1500));return;}
  if(b==="dhage"){bayan(t,1);dayan(t,440,.3,.8);bayan(t+beat/2,.7);return;}
  if(/^dh/.test(b)){bayan(t,1);dayan(t,440,/in|dhi/.test(b)?.55:.3,.9);return;}
  if(/^tin|^ti$|^tu/.test(b)){dayan(t,466,.6,.8);return;}
  if(/^kat|^ka|^ke|^ga/.test(b)){b.startsWith("ga")?bayan(t,.7):click(t,.5,1200);return;}
  dayan(t,440,.25,1);}
/* Practice time: while the theka plays for a piece you can practise, time is saved to your record every minute and on stop.
   Runs shorter than 10 seconds in total aren't counted. */
let pr=null;
function logPractice(key,sec){if(sec<1||S.readOnly)return;
  saveEnroll(e=>{const P=e.practice=e.practice||{},p=P[key]=P[key]||{s:0,days:0,day:"",last:0},now=Date.now(),d=dayKey(now);
    p.s=Math.round((p.s||0)+sec);if(p.day!==d){p.days=(p.days||0)+1;p.day=d;}p.last=now;});
  const el=$("#prac-stat");if(el&&el.dataset.k===key)el.textContent=pracText(pracOf(S.uid,key));}
function practiceCheckpoint(force){if(!pr)return;const now=Date.now(),sec=(now-pr.since)/1000;if(!force&&sec<60)return;
  if(pr.run+sec>=10){pr.run+=sec;pr.since=now;logPractice(pr.key,sec);}}
function practiceEnd(){practiceCheckpoint(true);pr=null;}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")practiceCheckpoint(true);});
/* Padhant sounds: tabla bols use the tabla strokes above; natwari (dance) bols a footfall and ghungroo; words and
   unrecognised bols a soft wood tick; a quiet metronome marks every matra (brightest on sam, lowest on khali). */
function thud(t,v){const a=ctx(),o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(55,t+.18);env(g,t,.6*v,.28);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.32);}
function ghung(t,v,len){const a=ctx();[0,.011,.024].forEach((dt,i)=>{const s=a.createBufferSource(),hp=a.createBiquadFilter(),g=a.createGain();s.buffer=noise;hp.type="highpass";hp.frequency.value=5200+i*900;env(g,t+dt,.22*v,Math.max(.05,(len||.12)-dt*2));s.connect(hp).connect(g).connect(a.destination);s.start(t+dt);s.stop(t+dt+.2);});}
function wood(t,v){const a=ctx(),o=a.createOscillator(),g=a.createGain();o.type="triangle";o.frequency.value=820;env(g,t,.18*v,.07);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.1);}
function metro(t,pos,tl){const a=ctx(),o=a.createOscillator(),g=a.createGain(),m=tl.v[pos];o.frequency.value=pos===0?1760:m==="0"?880:m?1320:1100;env(g,t,pos===0?.12:m?.07:.04,.04);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.06);}
function dance(nm,t,d){const b=nm.toLowerCase();
  if(b==="thei"){thud(t,1);ghung(t,.9);return;}
  if(b==="tat"){click(t,.45,2600);ghung(t,.7);return;}
  if(b==="aa"){ghung(t,.5,Math.min(.35,d));return;}
  if(b==="dig"){thud(t,.8);ghung(t+.02,.6);return;}
  if(b==="thun"){thud(t,.9);return;}
  if(b==="ki"){ghung(t,.55);return;}
  thud(t,.6);ghung(t,.6);}
function tabla(nm,t,d){const b=nm.toLowerCase();
  if(/^g/.test(b)){bayan(t,.75);return;}
  if(b==="kran"){click(t,.4,1300);dayan(t+Math.min(.05,d/3),440,.25,.85);return;}
  if(b==="ra"||b==="te"){dayan(t,520,.12,.6);return;}
  strike(nm,t,d);}
const TABLA_FORMS=new Set(["Paran","Kaida","Rela","Peshkar"]);
function bolSound(b,t,d,tab,word,depth){
  if(!b||b.r)return;
  if(word||b.u||b.q||!b.e){wood(t,.7);return;}
  const e=b.e;
  if(e.parts&&(depth||0)<3){const dd=d/e.parts.length;e.parts.forEach((p,j)=>{const pe=BOLMAP[p.toLowerCase()];bolSound(pe?{t:pe.c,e:pe}:{t:p,u:1},t+j*dd,dd,tab||e.cat==="t",false,(depth||0)+1);});return;}
  if(e.cat==="p"){ghung(t,.8,.2);return;}
  if(e.cat==="n"&&!tab){dance(e.c,t,d);return;}
  tabla(e.c,t,d);}
let timer=null,curTick=null;
function stop(){practiceEnd();clearInterval(timer);timer=null;curTick=null;S.playing=null;S.pmode="theka";S.beat=-1;S.pbeat=-1;S.pbol="";paint();renderPlayer();syncPlay();}
function bpmOf(c){return S.bpm[c.key]||c.bpm||90;}
function play(key,mode){
  mode=mode==="padhant"?"padhant":"theka";
  if(S.playing===key&&S.pmode===mode){stop();return;}
  const c=comp(key);if(!c)return;
  let seq=null;
  if(mode==="padhant"){seq=padSeq(parseNota(hasFull(key)?c.bols:firstLine(c.bols),c.taal,c.start,c.type));if(!seq.length)return;}
  stop();ctx();S.playing=key;S.pmode=mode;
  pr=canPractice(key)?{key,since:Date.now(),run:0}:null;
  const tl=TAALS[c.taal]||TAALS.teentaal,tab=TABLA_FORMS.has(c.type);let k=-1;
  curTick=seq?()=>{const cc=comp(key)||c,beat=60/bpmOf(cc),t=ctx().currentTime+.02;k=(k+1)%seq.length;const m=seq[k];
      S.beat=m.pos;S.pbeat=m.pi;S.pbol=m.bols.map(b=>b.t).join("-");metro(t,m.pos,tl);
      const dd=beat/(m.bols.length||1);m.bols.forEach((b,j)=>bolSound(b,t+j*dd,dd,tab,m.w));paint();practiceCheckpoint();}
    :()=>{const cc=comp(key)||c;S.beat=(S.beat+1)%tl.n;strike(tl.bols[S.beat],ctx().currentTime+.02,60/bpmOf(cc));paint();practiceCheckpoint();};
  renderPlayer();curTick();timer=setInterval(curTick,60000/bpmOf(c));syncPlay();
}
function retempo(key){if(S.playing===key&&curTick){const c=comp(key);if(!c)return;clearInterval(timer);timer=setInterval(curTick,60000/bpmOf(c));}}
function paint(){
  document.querySelectorAll(".m").forEach(el=>el.classList.toggle("on",S.playing===el.dataset.k&&+el.dataset.i===S.beat));
  document.querySelectorAll(".pm[data-pi]").forEach(el=>el.classList.toggle("on",S.pmode==="padhant"&&S.playing===el.dataset.k&&+el.dataset.pi===S.pbeat));
  const pb=$("#pbeat");if(pb&&S.playing){const c=comp(S.playing);if(c){const tl=TAALS[c.taal]||TAALS.teentaal;
    pb.textContent=S.pmode==="padhant"?`Padhant · matra ${S.beat+1}/${tl.n}${S.pbol?" · "+S.pbol:""}`:`${tl.name} · matra ${S.beat+1}/${tl.n} · ${tl.bols[S.beat]}`;}}}
function syncPlay(){document.querySelectorAll("[data-act=play]").forEach(b=>{const md=b.dataset.mode==="padhant"?"padhant":"theka",on=S.playing===b.dataset.k&&S.pmode===md;b.innerHTML=on?I.pause:I.play;b.setAttribute("aria-label",(on?"Pause ":"Play ")+(md==="padhant"?"bols":"theka"));});}

function earnings(){
  const rows=[];let tot=0;const by={listen:0,perform:0,teach:0,choreo:0};
  for(const [buyer,l] of Object.entries(S.ledgers)){for(const it of ((l||{}).items||[])){
    const c=comp(it.key);const owner=c?c.owner:String(it.key||"").split(":")[0];
    let share=0,what="";
    if(it.kind==="choreo"){if(it.seller===S.uid){share+=it.price*.7;what="Your choreography (70%)";}if(owner===S.uid){share+=it.price*.15;what=what?what+" + composition (15%)":"Choreography to your piece (15%)";}if(share)by.choreo+=share;}
    else if(owner===S.uid){share=it.price*.8;what=KIND[it.kind].n+" licence (80%)";by[it.kind]+=share;}
    if(share){tot+=share;rows.push({buyer,it,share,what,c});}
  }}
  rows.sort((a,b)=>b.it.at-a.it.at);return {tot,by,rows};
}

/* Views and dialogs are rebuilt with innerHTML, so focus is remembered as a selector (id, or the button's data-* attributes) rather than a node. */
const FOCUSABLE='a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
function focusKey(el){if(!el||el===document.body)return null;if(el.id)return{sel:"#"+CSS.escape(el.id),i:0};
  const t=el.closest("[data-act]");if(!t||t.dataset.act==="backdrop")return null;
  const sel=[...t.attributes].filter(x=>x.name.startsWith("data-")).map(x=>`[${x.name}="${CSS.escape(x.value)}"]`).join("");
  return{sel,i:[...document.querySelectorAll(sel)].indexOf(t)};}
function findKey(root,k){if(!k)return null;const all=root.querySelectorAll(k.sel);return all[k.i]||all[0]||null;}
let opener=null;
function setInert(on){["#app","#player"].forEach(s=>{const el=$(s);if(el)el.inert=on;});}
function openModal(kind,arg){if(!S.modal)opener=focusKey(document.activeElement);S.modal={kind,arg};S.confirm=null;setInert(true);renderModal();
  const f=$("#modal input:not([type=range]),#modal button.bigplay")||$("#modal .dlg");if(f)f.focus();}
function closeModal(){const was=!!S.modal;S.modal=null;S.confirm=null;notaUndo=null;recCache=null;renderModal();if(!was)return;setInert(false);
  const el=findKey(document,opener);opener=null;
  if(el)el.focus();else{const m=$("#main");m.tabIndex=-1;m.focus();}}
function renderModal(){const m=$("#modal");if(!S.modal){m.hidden=true;m.innerHTML="";return;}
  const k=S.modal.kind,a=S.modal.arg;
  const body=k==="detail"?mDetail(a):k==="comp"?mComp(a):k==="chor"?mChor():k==="acad"?mAcad():k==="level"?mLevel(a):k==="profile"?profileForm(me()):"";
  const ae=document.activeElement,had=m.contains(ae),fk=had?focusKey(ae):null;
  m.hidden=false;m.innerHTML=`<div class="modal" data-act="backdrop"><div class="dlg ${k==="detail"?"":"narrow"}" role="dialog" aria-modal="true" tabindex="-1"><button class="x" data-act="close" aria-label="Close">${I.x}</button>${body}</div></div>`;
  const dlg=$("#modal .dlg"),h=dlg.querySelector("h2");
  if(h){h.id="dlg-title";dlg.setAttribute("aria-labelledby","dlg-title");}else dlg.setAttribute("aria-label",k==="profile"?"Edit profile":"Dialog");
  if(had){const el=findKey(m,fk);(el||dlg).focus();}
  syncPlay();paint();
  const r=$("#bpm");if(r)r.oninput=e=>{S.bpm[a]=+e.target.value;$("#bpmv").textContent=e.target.value+" bpm";retempo(a);};
}

  side.hidden=false;
  const p=me();
  side.innerHTML=`<div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="3.5" r="1.8" fill="currentColor"/></svg>Layakari</div>`+
    NAV.map(([k,l])=>`<button class="nav" data-act="nav" data-v="${k}" ${S.view===k?'aria-current="page"':""}>${I[k]}${l}</button>`).join("")+
    `<div class="me">${avatar(S.uid,32)}<div style="min-width:0"><b>${esc(p.name)}</b><span>${esc(((p.roles||[]).map(r=>(ROLES.find(x=>x[0]===r)||[r,r])[1])).slice(0,2).join(" · "))}</span></div></div>`;
  const ae=document.activeElement,fk=main.contains(ae)?focusKey(ae):null,sel=ae&&ae.selectionStart!=null?[ae.selectionStart,ae.selectionEnd]:null;
  const v={discover:vDiscover,library:vLibrary,academy:vAcademy,studio:vStudio,profile:vProfile}[S.view]();
  main.innerHTML=`<div class="wrap">${S.readOnly?`<p class="note" style="margin-top:0">You can browse, but changes can't be saved with your access level.</p>`:""}${v}</div>`;
  if(fk){const el=findKey(main,fk);if(el){el.focus();if(sel&&el.setSelectionRange)try{el.setSelectionRange(sel[0],sel[1]);}catch(e){}}}
  const qi=$("#q");if(qi)qi.oninput=e=>{S.q=e.target.value;render();};
  const pv=$("#pv-lvl");if(pv)pv.onchange=e=>{S.pvLvl=e.target.value;render();};

}

/* ---------------- actions ---------------- */
function confirmOnce(tag){if(S.confirm===tag){S.confirm=null;return true;}S.confirm=tag;return false;}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;const d=t.dataset,act=d.act;
  if(act==="backdrop"){if(e.target===t)closeModal();return;}
  if(act==="demo-play"){demoPlay();return;}
  if(act==="to-how"){const h=document.getElementById("how");if(h)h.scrollIntoView({block:"start"});return;}
  if(act==="to-signup"){if(S.authMode!=="up"){S.authMode="up";S.authMsg="";demoStop();render();}window.scrollTo({top:0,behavior:"smooth"});setTimeout(()=>{const el=document.getElementById("au-email");if(el)el.focus({preventScroll:true});},300);return;}
  if(act==="auth-mode"){demoStop();S.authMode=S.authMode==="up"?"in":"up";S.authMsg="";render();return;}
  if(act==="signout"){stop();q.then(()=>sb.auth.signOut()).finally(()=>location.reload());return;}
  if(act==="close"){closeModal();return;}
  if(act==="nav"){S.view=d.v;S.confirm=null;closeModal();render();window.scrollTo(0,0);return;}
  if(act==="taal"){S.taal=d.t;render();return;}
  if(act==="open"){openModal("detail",d.k);return;}
  if(act==="play"){e.stopPropagation();play(d.k,d.mode);return;}
  if(act==="buy"){const c=comp(d.k);if(!c)return;const price=num((c.prices||{})[d.kind],0);
    saveLedger(l=>l.items.push({id:rid(),key:c.key,kind:d.kind,seller:c.owner,price,at:Date.now()})).then(()=>{if(S.modal)renderModal();});
    toast(`${KIND[d.kind].n} licence added for ${c.title}. Demo: no payment taken.`);renderModal();return;}
  if(act==="buych"){const ch=allChors().find(x=>x.ckey===d.c);if(!ch)return;
    saveLedger(l=>l.items.push({id:rid(),key:ch.comp,kind:"choreo",chor:ch.ckey,seller:ch.owner,price:num(ch.price,0),at:Date.now()}));
    toast(`Licensed "${ch.title}". Demo: no payment taken.`);renderModal();return;}
  if(act==="join"){saveEnroll(en=>{en.req[d.g]={at:Date.now()};});toast("Request sent. The guru will place you in a level.");return;}
  if(act==="leave"){const ac=academies().find(x=>x.guru===d.g),keeps=ac&&Object.keys(passesFor(ac,S.uid)).length;
    saveEnroll(en=>{delete en.req[d.g];});toast(keeps?"You've left the academy. Pieces from levels you passed stay in your library.":"Removed.");return;}
  if(act==="acad-form"){openModal("acad");return;}
  if(act==="acad-open"){saveMe(p=>{p.academy.open=p.academy.open===false;});return;}
  if(act==="lvl"){S.selLvl=d.l;S.confirm=null;render();return;}
  if(act==="lvl-form"){openModal("level",d.l);return;}
  if(act==="lvl-mv"){saveMe(p=>{const ls=p.academy.levels||[],i=ls.findIndex(l=>l.id===d.l),j=i+(+d.dir);if(i<0||j<0||j>=ls.length)return;[ls[i],ls[j]]=[ls[j],ls[i]];});return;}
  if(act==="pass"){if(!confirmOnce("pass:"+d.s)){render();return;}
    const A=me().academy;if(!A)return;const ls=A.levels||[],cur=(A.roster||{})[d.s],i=ls.findIndex(l=>l.id===cur);if(i<0)return;
    const L=ls[i],nx=ls[i+1],pieces=levelPieces(A,cur);
    saveMe(p=>{const a=p.academy;a.passed=a.passed||{};(a.passed[d.s]=a.passed[d.s]||{})[cur]={at:Date.now(),name:L.name,pieces};if(nx)a.roster[d.s]=nx.id;});
    toast(nx?`${pname(d.s)} passed ${L.name} and moved up to ${nx.name}.`:`${pname(d.s)} passed ${L.name}, your top level.`);return;}
  if(act==="lvl-del"){if(!confirmOnce("lvl:"+d.l)){render();return;}saveMe(p=>{const a=p.academy;a.levels=a.levels.filter(l=>l.id!==d.l);for(const s in (a.roster||{}))if(a.roster[s]===d.l)a.roster[s]=a.levels[0]?a.levels[0].id:null;});toast("Level deleted. Its students moved to the first level.");return;}
  if(act==="piece"){saveMe(p=>{const l=p.academy.levels.find(x=>x.id===S.selLvl);if(!l)return;l.pieces=l.pieces||[];const i=l.pieces.indexOf(d.k);if(i>-1)l.pieces.splice(i,1);else l.pieces.push(d.k);});return;}
  if(act==="approve"){const s=$("#ap-"+CSS.escape(d.s));const lv=s&&s.value;if(!lv)return;saveMe(p=>{p.academy.roster=p.academy.roster||{};p.academy.roster[d.s]=lv;if(p.academy.declined)delete p.academy.declined[d.s];});toast(`${pname(d.s)} joined your academy.`);return;}
  if(act==="decline"){saveMe(p=>{p.academy.declined=p.academy.declined||{};p.academy.declined[d.s]=true;});return;}
  if(act==="remove"){if(!confirmOnce("rm:"+d.s)){render();return;}saveMe(p=>{delete p.academy.roster[d.s];});toast(`${pname(d.s)} removed.`);return;}
  if(act==="comp-form"){notaUndo=null;recCache=null;openModal("comp",d.id);return;}
  if(act==="nota-tidy"){const f=formVals();if(!f.text.trim()){notaMsg("Type or paste some bols first.");return;}
    const N=parseNota(f.text,f.tk,f.start,f.type),out=tidyNota(f.text,f.tk,f.start,f.type);
    if(out.trim()===f.text.trim()){notaMsg("Already in the standard format.");return;}
    const fx=N.fixes.slice(0,3).map(([a,b])=>`${a} → ${b}`).join(", ");
    notaSet(out,`Tidied into the standard format${N.fixes.length?`, with ${N.fixes.length} spelling${N.fixes.length===1?"":"s"} standardised (${fx}${N.fixes.length>3?"…":""})`:""}.`);return;}
  if(act==="nota-photo"||act==="nota-rec"){const i=$(act==="nota-photo"?"#nota-img":"#nota-aud");if(i){i.value="";i.click();}return;}

  if(act==="rec-realign"){if(recCache)applyRec(recCache.sub);return;}
  if(act==="comp-del"){if(!confirmOnce("comp:"+d.id)){renderModal();return;}const key=S.uid+":"+d.id;if(S.playing===key)stop();
    saveMe(p=>{p.compositions=(p.compositions||[]).filter(c=>c.id!==d.id);if(p.academy)(p.academy.levels||[]).forEach(l=>{l.pieces=(l.pieces||[]).filter(k=>k!==key);});});closeModal();toast("Composition deleted.");return;}
  if(act==="samples"){saveMe(p=>{p.compositions=p.compositions||[];SAMPLES.forEach((s,i)=>p.compositions.push(Object.assign({},s,{id:rid(),created:Date.now()-i*1000,prices:{listen:2,perform:[25,20,15,25,15,10][i],teach:[99,79,69,99,69,49][i]}})));});toast("Six sample compositions added to your catalogue.");return;}
  if(act==="ch-form"){openModal("chor");return;}
  if(act==="ch-del"){if(!confirmOnce("ch:"+d.id)){render();return;}saveMe(p=>{p.choreographies=(p.choreographies||[]).filter(c=>c.id!==d.id);});return;}
  if(act==="prof-form"){openModal("profile");return;}
});
document.addEventListener("input",e=>{const id=e.target&&e.target.id;if(id==="cf-bols"||id==="cf-start"){clearTimeout(prevT);prevT=setTimeout(updatePrev,150);}});
document.addEventListener("change",e=>{const t=e.target;
  if(t.id==="nota-img"){readPhoto(t.files&&t.files[0]);return;}
  if(t.id==="nota-aud"){readRecording(t.files&&t.files[0]);return;}
  if(t.id==="rec-sub"){applyRec(+t.value);return;}
  if(t.id==="cf-taal"){const s=$("#cf-start");if(s){const n=(TAALS[t.value]||TAALS.teentaal).n;s.max=n;if(+s.value>n)s.value=n;}updatePrev();return;}
  if(t.id==="cf-start"||t.id==="cf-type"){updatePrev();return;}
  if(t.dataset&&t.dataset.act==="move"){const sid=t.dataset.s,v=t.value;saveMe(p=>{p.academy.roster[sid]=v;});toast(`${pname(sid)} moved to a new level.`);}});
document.addEventListener("keydown",e=>{if(!S.modal)return;
  if(e.key==="Escape"){closeModal();return;}
  if(e.key!=="Tab")return;
  const dlg=$("#modal .dlg");if(!dlg)return;
  const f=[...dlg.querySelectorAll(FOCUSABLE)].filter(el=>el.getClientRects().length);if(!f.length){e.preventDefault();dlg.focus();return;}
  const first=f[0],last=f[f.length-1],ae=document.activeElement;
  if(!dlg.contains(ae)||ae===dlg){e.preventDefault();(e.shiftKey?last:first).focus();}
  else if(e.shiftKey&&ae===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&ae===last){e.preventDefault();first.focus();}});
document.addEventListener("submit",e=>{
  const f=e.target;if(!f.dataset||!f.dataset.form)return;e.preventDefault();const v=id=>{const el=document.getElementById(id);return el?el.value.trim():"";};
  const kind=f.dataset.form;
  if(kind==="auth"){const email=v("au-email"),password=document.getElementById("au-pass").value;if(!email||!password)return;
    S.authBusy=true;S.authMsg="";const keepEmail=email;
    const done=msg=>{S.authBusy=false;S.authMsg=msg||"";render();const el=document.getElementById("au-email");if(el)el.value=keepEmail;};
    if(S.authMode==="up"){sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin}}).then(({data,error})=>{
        if(error)return done(error.message);
        if(!data.session)return done("Almost there: check your email and click the confirmation link, then sign in here.");
        done("");});}
    else{sb.auth.signInWithPassword({email,password}).then(({error})=>{if(error)return done(error.message==="Invalid login credentials"?"That email and password don't match. Try again or create an account.":error.message);done("");});}
    return;}
  if(kind==="profile"){const prof={name:v("pf-name"),city:v("pf-city"),bio:v("pf-bio"),roles:ROLES.map(r=>r[0]).filter(k=>document.getElementById("pf-r-"+k).checked)};if(!prof.name)return;
    if(S.gate==="onboard"){const p=Object.assign({compositions:[],choreographies:[],created:Date.now()},prof);S.profiles[S.uid]=p;S.gate=null;S.view=prof.roles.includes("composer")?"studio":prof.roles.includes("guru")?"academy":"discover";render();queue(()=>S.db.doc("profiles/"+S.uid).set(p));toast("Profile created. Welcome to Layakari.");return;}
    saveMe(p=>Object.assign(p,prof));closeModal();toast("Profile saved.");return;}
  if(kind==="comp"){const id=f.dataset.id;const data={title:v("cf-title"),type:v("cf-type"),taal:v("cf-taal"),laya:v("cf-laya"),bpm:Math.min(240,Math.max(30,parseInt(v("cf-bpm"))||90)),bols:document.getElementById("cf-bols").value.replace(/\s+$/,""),prices:{listen:num(v("cf-pl"),2),perform:num(v("cf-pp"),25),teach:num(v("cf-pt"),99)}};if(!data.title)return;
    data.start=Math.min((TAALS[data.taal]||TAALS.teentaal).n,Math.max(1,parseInt(v("cf-start"))||1));
    saveMe(p=>{p.compositions=p.compositions||[];if(id){const c=p.compositions.find(x=>x.id===id);if(c)Object.assign(c,data);}else p.compositions.unshift(Object.assign({id:rid(),created:Date.now()},data));});closeModal();toast(id?"Composition saved.":"Composition published.");return;}
  if(kind==="chor"){const data={id:rid(),title:v("ch-title"),comp:v("ch-comp"),price:num(v("ch-price"),49),about:v("ch-about"),created:Date.now()};if(!data.title||!data.comp)return;saveMe(p=>{(p.choreographies=p.choreographies||[]).push(data);});closeModal();toast("Choreography published and linked.");return;}
  if(kind==="acad"){const data={name:v("ac-name"),about:v("ac-about"),fee:num(v("ac-fee"),0)};if(!data.name)return;
    saveMe(p=>{if(p.academy)Object.assign(p.academy,data);else p.academy=Object.assign({open:true,created:Date.now(),roster:{},declined:{},levels:["Prarambhik","Madhyama","Visharad"].map(n=>({id:rid(),name:n,pieces:[]}))},data);
      if(!(p.roles||[]).includes("guru"))(p.roles=p.roles||[]).push("guru");});closeModal();toast(data.name+" is ready.");return;}
  if(kind==="level"){const id=f.dataset.id,name=v("lv-name");if(!name)return;saveMe(p=>{const ls=p.academy.levels=p.academy.levels||[];if(id){const l=ls.find(x=>x.id===id);if(l)l.name=name;}else{const nl={id:rid(),name,pieces:[]};ls.push(nl);S.selLvl=nl.id;}});closeModal();return;}
});

/* ---------------- boot ---------------- */
function maybeReady(){
  if(!(S.loaded.p&&S.loaded.l&&S.loaded.e))return;
  if(!S.profiles[S.uid]){if(S.gate!=="onboard"){S.gate="onboard";render();}return;}
  if(S.gate)S.gate=null;
  capturePasses();
  render();if(S.modal&&S.modal.kind==="detail")renderModal();
}
let started=false;
function start(session){
  if(!session){S.gate="signin";render();return;}
  if(started)return;started=true;demoStop();
  S.db=makeDb();S.user=session.user;S.uid=session.user.id;S.gate="loading";render();
  loadBolDb();
  const toMap=snap=>{const o={};snap.docs.forEach(d=>{if(d.exists)o[d.id]=d.data();});return o;};
  const onErr=e=>{console.error(e);toast("Couldn't load data. Check your connection and refresh.");};
  S.db.collection("profiles").onSnapshot(s=>{S.profiles=toMap(s);S.loaded.p=true;maybeReady();},onErr);
  S.db.collection("ledger").onSnapshot(s=>{S.ledgers=toMap(s);S.loaded.l=true;maybeReady();},onErr);
  S.db.collection("enroll").onSnapshot(s=>{S.enrolls=toMap(s);S.loaded.e=true;maybeReady();},onErr);
}
async function boot(){
  render();
  if(SUPABASE_URL.startsWith("PASTE")){document.getElementById("main").innerHTML=`<div class="wrap"><div class="empty"><b>Almost ready</b>Add your Supabase Project URL and publishable key at the top of the script in index.html.</div></div>`;return;}
  sb.auth.onAuthStateChange((ev,session)=>{setTimeout(()=>{if(ev==="SIGNED_OUT"){location.reload();return;}if(session&&!started)start(session);},0);});
  const {data}=await sb.auth.getSession();
  start(data.session);
}
boot();
})();
</script>
