name: Web app

on:
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web.yml"]

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # A private local Supabase (Postgres 16 is preinstalled on the runner). Never the live project.
      - name: Start local Supabase
        run: |
          bash scripts/local-supabase.sh up > /tmp/supabase-env
          grep '^NEXT_PUBLIC_' /tmp/supabase-env > .env.local
          echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000" >> .env.local
      - name: Database access rules
        run: npm run test:db
      - name: Fresh seed for browser tests
        run: bash scripts/local-supabase.sh reset > /dev/null
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
